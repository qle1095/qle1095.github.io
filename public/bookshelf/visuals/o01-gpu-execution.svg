<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Read a GPU as compute, storage and traffic</title><desc id="desc">Device memory holds weights, KV and workspace. Operands move through shared L2 and SM-local storage into Tensor Core MMA. Three separate limits are illustrated: capacity must fit all allocations, bandwidth bounds byte movement, and compute bounds arithmetic.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Read a GPU as compute, storage and traffic</text><rect x="40" y="90" width="280" height="130" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="54" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Device memory</text><text x="54" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Weights + KV + buffers</text><text x="54" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Capacity: GB</text><text x="54" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Movement: GB/s</text><rect x="385" y="105" width="180" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="399" y="134" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Shared L2</text><text x="399" y="163" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Reuse across SMs</text><rect x="645" y="85" width="310" height="140" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="659" y="114" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Streaming Multiprocessor</text><text x="659" y="143" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Local cache / shared memory</text><text x="659" y="168" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Tensor Core: D = A × B + C</text><text x="659" y="193" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Scalar and special functions</text><path d="M320 150 L385 150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M565 150 L645 150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="280" font-size="23" fill="#0f172a" font-weight="bold" text-anchor="start">Same model, three distinct constraints</text><rect x="40" y="310" width="280" height="155" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="54" y="339" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">1 · Does it fit?</text><text x="54" y="368" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">140 GB weights</text><text x="54" y="393" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">+ KV + workspace</text><text x="54" y="418" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">80 GB device: cannot fit</text><rect x="360" y="310" width="280" height="155" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="374" y="339" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">2 · Can bytes arrive?</text><text x="374" y="368" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">140 GB / 2000 GB/s</text><text x="374" y="393" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">= 70 ms weight-traffic floor</text><text x="374" y="418" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">More FLOPS cannot fix this</text><rect x="680" y="310" width="280" height="155" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="694" y="339" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">3 · Can math finish?</text><text x="694" y="368" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Work / achieved FLOP/s</text><text x="694" y="393" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Precision and shape matter</text><text x="694" y="418" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Reuse raises work per byte</text><text x="40" y="520" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="start">Schematic. Example uses decimal GB; ignores cache reuse and other work.</text></g></svg>