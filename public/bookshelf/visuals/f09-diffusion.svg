<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 960" role="img" aria-labelledby="title desc"><title id="title">Denoising updates a whole latent object at each step</title><desc id="desc">A text encoder supplies conditioning to a denoiser that repeatedly updates a noisy latent via a scheduler, followed by VAE decoding to pixels. Classical classifier-free guidance combines conditional and unconditional predictions. Video expands the latent through time; full spatiotemporal attention connects positions across frames, unlike independent frame generation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="960" fill="#f8fafc"/><text x="35" y="40" class="title">Denoising updates a whole latent object at each step</text><rect x="40" y="87" width="235" height="83" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="115" class="label">Prompt → text encoder</text><text x="54" y="140" class="">Conditioning vectors</text><rect x="340" y="87" width="335" height="83" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="354" y="115" class="label">Random latent noise</text><text x="354" y="140" class="">Compressed image representation</text><line x1="275" y1="129" x2="340" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="510" y1="170" x2="510" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="222" width="335" height="86" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="354" y="250" class="label">Denoiser + scheduler</text><text x="354" y="275" class="">Predict update → next latent</text><line x1="675" y1="264" x2="735" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="735" y="222" width="325" height="86" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="749" y="250" class="label">VAE decoder</text><text x="749" y="275" class="">Final latent → pixels</text><line x1="340" y1="266" x2="300" y2="266" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="266" x2="300" y2="202" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="202" x2="475" y2="202" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="475" y1="202" x2="475" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="244" class="">Repeat the update,</text><text x="40" y="275" class="">not just the last pixel.</text><text x="40" y="345" class="small">Denoiser may be a UNet with attention or a diffusion transformer; not all pipelines are identical.</text><line x1="40" y1="374" x2="1060" y2="374" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="411" class="label">CLASSICAL CLASSIFIER-FREE GUIDANCE</text><rect x="40" y="443" width="305" height="78" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="471" class="label">Unconditional prediction</text><text x="54" y="496" class="">No positive prompt condition</text><rect x="40" y="542" width="305" height="78" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="570" class="label">Conditional prediction</text><text x="54" y="595" class="">With prompt condition</text><line x1="345" y1="480" x2="420" y2="508" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="345" y1="579" x2="420" y2="548" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="482" width="640" height="95" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="434" y="510" class="label">Combine: u + s(c − u)</text><text x="434" y="535" class="">Two predictions can be batched in one model invocation.</text><text x="434" y="560" class="">Guidance scale s is real-valued; other guidance methods exist.</text><text x="40" y="657" class="small">50 steps × 2 predictions = 100 evaluations; this need not be 100 sequential invocations.</text><line x1="40" y1="687" x2="1060" y2="687" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="727" class="label">VIDEO ADDS A TEMPORAL AXIS</text><rect x="40" y="765" width="150" height="100" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="62" y="798" class="">Frame 1</text><text x="62" y="829" class="">X × Y latent</text><rect x="260" y="765" width="150" height="100" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="282" y="798" class="">Frame 2</text><text x="282" y="829" class="">X × Y latent</text><rect x="480" y="765" width="150" height="100" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="502" y="798" class="">Frame 3</text><text x="502" y="829" class="">X × Y latent</text><line x1="190" y1="815" x2="260" y2="815" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="410" y1="815" x2="480" y2="815" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="725" y="785" class="">Joint denoising connects</text><text x="725" y="816" class="">spatial and temporal positions.</text><text x="725" y="850" class="">More positions → more attention work.</text><text x="40" y="915" class="small">Schematic: temporal links are not a claim that the model simply generates one frame from the previous one.</text><line x1="260" y1="849" x2="190" y2="849" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="480" y1="849" x2="410" y2="849" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/></svg>