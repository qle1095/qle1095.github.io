<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" role="img" aria-labelledby="title desc"><title id="title">Video work is partitioned, not magically independent</title><desc id="desc">Four devices each store weights and own one spatiotemporal context shard; ring arrows exchange key/value information. A step-versus-layer grid distinguishes protected high-precision work from candidates for caching or quantization. A timing bar reduces eight seconds attention to four while two seconds other work stays, and shows how added communication lowers end-to-end gain.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="710" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Video work is partitioned, not magically independent</text><text x="35" y="80" font-size="21" fill="#0f172a" text-anchor="start">Context parallelism: weights replicated, context partitioned</text><rect x="50" y="110" width="360" height="85" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="230.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">GPU 0</text><text x="230.0" y="161" font-size="18" fill="#0f172a" text-anchor="middle">Weights + context A</text><rect x="550" y="110" width="360" height="85" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="730.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">GPU 1</text><text x="730.0" y="161" font-size="18" fill="#0f172a" text-anchor="middle">Weights + context B</text><rect x="550" y="270" width="360" height="85" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="730.0" y="297" font-size="18" fill="#0f172a" text-anchor="middle">GPU 2</text><text x="730.0" y="321" font-size="18" fill="#0f172a" text-anchor="middle">Weights + context C</text><rect x="50" y="270" width="360" height="85" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="230.0" y="297" font-size="18" fill="#0f172a" text-anchor="middle">GPU 3</text><text x="230.0" y="321" font-size="18" fill="#0f172a" text-anchor="middle">Weights + context D</text><path d="M410,150 L550,150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M730,195 L730,270" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M550,310 L410,310" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M230,270 L230,195" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="330" y="230" font-size="18" fill="#0f172a" text-anchor="start">Exchange K/V blocks; accumulate local attention</text><text x="35" y="415" font-size="21" fill="#0f172a" text-anchor="start">Candidate precision policy (must evaluate quality)</text><text x="295" y="450" font-size="18" fill="#0f172a" text-anchor="middle">Early steps</text><text x="470" y="450" font-size="18" fill="#0f172a" text-anchor="middle">Later steps</text><text x="35" y="498" font-size="18" fill="#0f172a" text-anchor="start">First layer</text><rect x="220" y="470" width="150" height="42" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/><text x="295.0" y="497" font-size="18" fill="#0f172a" text-anchor="middle">High precision</text><rect x="395" y="470" width="150" height="42" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/><text x="470.0" y="497" font-size="18" fill="#0f172a" text-anchor="middle">High precision</text><text x="35" y="550" font-size="18" fill="#0f172a" text-anchor="start">Hidden layers</text><rect x="220" y="522" width="150" height="42" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/><text x="295.0" y="549" font-size="18" fill="#0f172a" text-anchor="middle">High precision</text><rect x="395" y="522" width="150" height="42" rx="8" fill="#99f6e4" stroke="#2563eb" stroke-width="2"/><text x="470.0" y="549" font-size="18" fill="#0f172a" text-anchor="middle">Test low bits</text><text x="35" y="602" font-size="18" fill="#0f172a" text-anchor="start">Last layer</text><rect x="220" y="574" width="150" height="42" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/><text x="295.0" y="601" font-size="18" fill="#0f172a" text-anchor="middle">High precision</text><rect x="395" y="574" width="150" height="42" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/><text x="470.0" y="601" font-size="18" fill="#0f172a" text-anchor="middle">High precision</text><text x="610" y="450" font-size="21" fill="#0f172a" text-anchor="start">Timing example</text><text x="610" y="490" font-size="18" fill="#0f172a" text-anchor="start">Before: 8 s attention + 2 s other</text><text x="610" y="529" font-size="18" fill="#0f172a" text-anchor="start">2× attention speed → 6 s total</text><text x="610" y="569" font-size="18" fill="#0f172a" text-anchor="start">+ 1 s communication → 7 s</text><text x="610" y="609" font-size="20" fill="#0f172a" text-anchor="start">10 / 7 = 1.43× end-to-end</text><text x="35" y="662" font-size="18" fill="#0f172a" text-anchor="start">Caching can skip timesteps or layer recomputation; each path needs a quality gate.</text></g></svg>