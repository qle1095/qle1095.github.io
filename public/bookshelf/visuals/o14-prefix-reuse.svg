<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Reuse causal state without the wrong context</title><desc id="desc">Request A has tokens SYSTEM, DOC, QUESTION_A, END; request B has SYSTEM, DOC, QUESTION_B, END. The first two tokens share causal history and cached KV. At the question mismatch, downstream state diverges even though END text matches. A second example starts with different nonces, producing zero reusable prefix. Cache validity also depends on model and representation identity.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Reuse causal state without the wrong context</text><text x="35" y="88" font-size="23" fill="#0f172a" font-weight="bold" text-anchor="start">Same prefix, then different causal history</text><rect x="35" y="120" width="190" height="90" rx="10" fill="#ccfbf1" stroke="#64748b"/><text x="49" y="149" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">SYSTEM</text><text x="49" y="178" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">shared KV</text><rect x="275" y="120" width="170" height="90" rx="10" fill="#ccfbf1" stroke="#64748b"/><text x="289" y="149" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">DOC</text><text x="289" y="178" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">shared KV</text><rect x="495" y="120" width="240" height="90" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="509" y="149" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">QUESTION_A</text><text x="509" y="178" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">compute unique state</text><rect x="785" y="120" width="180" height="90" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="799" y="149" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">END</text><text x="799" y="178" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">context A</text><path d="M225 165 L275 165" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M445 165 L495 165" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M735 165 L785 165" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="35" y="270" width="190" height="90" rx="10" fill="#ccfbf1" stroke="#64748b"/><text x="49" y="299" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">SYSTEM</text><text x="49" y="328" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">reuse KV</text><rect x="275" y="270" width="170" height="90" rx="10" fill="#ccfbf1" stroke="#64748b"/><text x="289" y="299" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">DOC</text><text x="289" y="328" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">reuse KV</text><rect x="495" y="270" width="240" height="90" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="509" y="299" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">QUESTION_B</text><text x="509" y="328" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">first mismatch</text><rect x="785" y="270" width="180" height="90" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="799" y="299" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">END</text><text x="799" y="328" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">context B</text><path d="M225 315 L275 315" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M445 315 L495 315" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M735 315 L785 315" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="415" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Matching END text does not restore matching causal state.</text><text x="35" y="463" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Different nonce at position 1 → zero shared prefix, even if all later text matches.</text><text x="35" y="510" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Validity includes model / adapter / tokenizer / position and representation.</text></g></svg>