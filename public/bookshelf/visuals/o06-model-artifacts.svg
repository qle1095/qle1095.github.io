<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">Separate weights, code, compilation and runtime</title><desc id="desc">A weights-only path combines safetensors, configuration and model implementation before framework or inference-engine execution; optional compilation optimizes supported regions. A second path exports graph and tensor data to ONNX Runtime or TensorRT. Evaluation mode and gradient tracking are separate choices from compilation, and executable model code remains a trust boundary.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="580" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Separate weights, code, compilation and runtime</text><rect x="30" y="90" width="245" height="125" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Weights-only path</text><text x="44" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">safetensors: tensor data</text><text x="44" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">configuration + tokenizer</text><text x="44" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">architecture implementation</text><rect x="385" y="90" width="260" height="125" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="399" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Framework / engine</text><text x="399" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Supported model code</text><text x="399" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Optional compilation</text><text x="399" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Kernels execute operations</text><rect x="755" y="90" width="215" height="125" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="769" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Output</text><text x="769" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Correct I/O first</text><text x="769" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Then performance</text><path d="M275 150 L385 150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M645 150 L755 150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="285" width="245" height="110" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="314" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Graph export path</text><text x="44" y="343" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Supported graph + weights</text><text x="44" y="368" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">ONNX representation</text><rect x="385" y="285" width="260" height="110" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="399" y="314" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Execution runtime</text><text x="399" y="343" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">ONNX Runtime providers</text><text x="399" y="368" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">or NVIDIA TensorRT</text><rect x="755" y="285" width="215" height="110" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="769" y="314" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Compatibility gate</text><text x="769" y="343" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Ops, shapes, types</text><text x="769" y="368" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">must be supported</text><path d="M275 340 L385 340" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M645 340 L755 340" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="460" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">eval(): module behavior   |   no_grad / inference_mode: autograd behavior</text><text x="35" y="500" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="start">torch.compile: optional optimization, not a requirement for inference</text><text x="35" y="540" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="start">Data-only weights do not establish trust in executable model code.</text></g></svg>