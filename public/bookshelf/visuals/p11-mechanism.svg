<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" role="img" aria-labelledby="title desc"><title id="title">Global placement starts with eligibility</title><desc id="desc">A global control plane manages three regional workload planes through dashed control arrows while requests use local serving paths. Eligibility filters model/hardware and data policy before latency scoring. Region A has 40 ms network plus 400 ms queue; B has 100 plus 20. Capacity choices distinguish reserved baseline, on-demand peaks and interruption-tolerant spot work.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="790" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Global placement starts with eligibility</text><text x="35" y="82" font-size="19" fill="#0f172a" text-anchor="start">Control arrows are dashed; local request paths are solid.</text><rect x="335" y="108" width="330" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="135" font-size="18" fill="#0f172a" text-anchor="middle">Global control plane</text><rect x="35" y="243" width="280" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="175.0" y="270" font-size="18" fill="#0f172a" text-anchor="middle">Region A workload plane</text><path d="M500,173 L175,243" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><text x="175" y="373" font-size="18" fill="#0f172a" text-anchor="middle">Local clients</text><path d="M175,353 L175,313" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="355" y="243" width="280" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="495.0" y="270" font-size="18" fill="#0f172a" text-anchor="middle">Region B workload plane</text><path d="M500,173 L495,243" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><text x="495" y="373" font-size="18" fill="#0f172a" text-anchor="middle">Local clients</text><path d="M495,353 L495,313" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="675" y="243" width="280" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="815.0" y="270" font-size="18" fill="#0f172a" text-anchor="middle">Region C workload plane</text><path d="M500,173 L815,243" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><text x="815" y="373" font-size="18" fill="#0f172a" text-anchor="middle">Local clients</text><path d="M815,353 L815,313" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="35" y="420" font-size="20" fill="#0f172a" text-anchor="start">1. Check eligibility: data policy + model / hardware compatibility</text><text x="35" y="454" font-size="20" fill="#0f172a" text-anchor="start">2. Score eligible regions: network + queue + service estimates</text><rect x="35" y="480" width="430" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="507" font-size="18" fill="#0f172a" text-anchor="middle">A: 40 ms network + 400 ms queue</text><text x="250.0" y="531" font-size="18" fill="#0f172a" text-anchor="middle">440 ms before service</text><rect x="535" y="480" width="430" height="70" rx="8" fill="#ccfbf1" stroke="#2563eb" stroke-width="2"/><text x="750.0" y="507" font-size="18" fill="#0f172a" text-anchor="middle">B: 100 ms network + 20 ms queue</text><text x="750.0" y="531" font-size="18" fill="#0f172a" text-anchor="middle">120 ms before service</text><text x="35" y="595" font-size="20" fill="#0f172a" text-anchor="start">Capacity portfolio — match the failure and cost properties</text><rect x="35" y="622" width="285" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="177.5" y="649" font-size="18" fill="#0f172a" text-anchor="middle">Reserved / committed</text><text x="177.5" y="673" font-size="18" fill="#0f172a" text-anchor="middle">Baseline; terms vary</text><rect x="357" y="622" width="285" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="499.5" y="649" font-size="18" fill="#0f172a" text-anchor="middle">On demand</text><text x="499.5" y="673" font-size="18" fill="#0f172a" text-anchor="middle">Peaks; availability varies</text><rect x="679" y="622" width="285" height="80" rx="8" fill="#ccfbf1" stroke="#2563eb" stroke-width="2"/><text x="821.5" y="649" font-size="18" fill="#0f172a" text-anchor="middle">Interruptible / spot</text><text x="821.5" y="673" font-size="18" fill="#0f172a" text-anchor="middle">Restartable work</text><text x="35" y="747" font-size="18" fill="#0f172a" text-anchor="start">Control-plane unavailability need not stop existing serving; test the dependency.</text></g></svg>