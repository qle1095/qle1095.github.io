<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="title desc">
<title id="title">Follow the request from a product contract to an observed result</title>
<desc id="desc">Requirements determine workload and quality gates. Model mechanics create compute, memory and communication demand. Hardware and runtime serve that demand; production routing and clients determine user-visible results. Measurements feed back to every decision.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#0f172a" stroke-width="1.5"/></marker></defs>
<rect width="1060" height="680" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#0f172a"><text x="35" y="43" font-size="25" font-weight="700">Optimize the request path against a user requirement</text>
<g font-size="19"><rect x="35" y="90" width="285" height="150" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="55" y="122" font-weight="700">1. Product contract</text><text x="55" y="157">Task quality · latency limits</text><text x="55" y="188">Traffic · privacy · budget</text><text x="55" y="218">What counts as useful?</text>
<rect x="390" y="90" width="285" height="150" rx="12" fill="#fff" stroke="#94a3b8"/><text x="410" y="122" font-weight="700">2. Model mechanics</text><text x="410" y="157">Prefill · decode · denoising</text><text x="410" y="188">Tensor shapes · KV state</text><text x="410" y="218">What work is required?</text>
<rect x="740" y="90" width="285" height="150" rx="12" fill="#ccfbf1" stroke="#0f766e"/><text x="760" y="122" font-weight="700">3. Resource demand</text><text x="760" y="157">Compute · memory capacity</text><text x="760" y="188">Memory traffic · network</text><text x="760" y="218">What limits progress?</text>
<rect x="740" y="330" width="285" height="150" rx="12" fill="#fff" stroke="#94a3b8"/><text x="760" y="362" font-weight="700">4. Serving implementation</text><text x="760" y="397">GPU · kernels · runtime</text><text x="760" y="428">Batching · caches · precision</text><text x="760" y="458">What tradeoff changes?</text>
<rect x="390" y="330" width="285" height="150" rx="12" fill="#fff" stroke="#94a3b8"/><text x="410" y="362" font-weight="700">5. Production path</text><text x="410" y="397">Queue · routing · scaling</text><text x="410" y="428">Rollout · failure · client</text><text x="410" y="458">Can it sustain real traffic?</text>
<rect x="35" y="330" width="285" height="150" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="55" y="362" font-weight="700">6. Observed result</text><text x="55" y="397">Quality · percentiles · errors</text><text x="55" y="428">Goodput · total cost</text><text x="55" y="458">Did the user contract hold?</text></g>
<g stroke="#0f172a" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M325 165H380"/><path d="M680 165H730"/><path d="M883 250V320"/><path d="M730 405H685"/><path d="M380 405H330"/><path d="M177 490V575H1015V505"/></g>
<text x="240" y="553" font-size="20" font-weight="700">Measure → explain → change one variable → measure again</text>
<text x="35" y="631" font-size="18">A local speedup matters only if the complete system meets its quality, latency and operating constraints.</text>
</g></svg>