<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-labelledby="title desc"><title id="title">Container packaging stops at a host boundary</title><desc id="desc">A registry distributes read-only image layers into a running container with a writable top layer. The host Linux kernel and GPU driver sit below the container boundary. Durable state is mounted separately. A release record links image digest, model/tokenizer revision, engine configuration and target hardware; prepared NIM and custom-image routes meet the same compatibility checks.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="690" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Container packaging stops at a host boundary</text><text x="35" y="80" font-size="21" fill="#0f172a" text-anchor="start">Build artifacts and runtime state have different lifecycles</text><rect x="35" y="110" width="430" height="55" rx="8" fill="#ccfbf1" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Running container: writable layer</text><rect x="35" y="180" width="430" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="207" font-size="18" fill="#0f172a" text-anchor="middle">Application + engine: image layer</text><rect x="35" y="250" width="430" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="277" font-size="18" fill="#0f172a" text-anchor="middle">Framework + CUDA libraries: image layer</text><rect x="35" y="320" width="430" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="347" font-size="18" fill="#0f172a" text-anchor="middle">Base OS filesystem: image layer</text><rect x="20" y="95" width="460" height="300" rx="8" fill="none" stroke="#2563eb" stroke-width="2"/><text x="35" y="421" font-size="20" fill="#0f172a" text-anchor="start">Host boundary</text><rect x="35" y="440" width="430" height="75" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="467" font-size="18" fill="#0f172a" text-anchor="middle">Linux kernel + device access</text><text x="250.0" y="491" font-size="18" fill="#0f172a" text-anchor="middle">Compatible GPU driver / architecture</text><rect x="595" y="110" width="350" height="80" rx="8" fill="#ccfbf1" stroke="#2563eb" stroke-width="2"/><text x="770.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Durable results / state</text><text x="770.0" y="161" font-size="18" fill="#0f172a" text-anchor="middle">Outside container writable layer</text><path d="M465,138 L595,150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="595" y="245" width="350" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="770.0" y="272" font-size="18" fill="#0f172a" text-anchor="middle">Artifact cache</text><text x="770.0" y="296" font-size="18" fill="#0f172a" text-anchor="middle">Weights / compiled engine</text><text x="770.0" y="320" font-size="18" fill="#0f172a" text-anchor="middle">Version + compatibility key</text><path d="M595,290 L465,205" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="560" y="390" font-size="22" fill="#0f172a" text-anchor="start">Release identity</text><text x="555" y="427" font-size="18" fill="#0f172a" text-anchor="start">Image digest + resolved dependencies</text><text x="555" y="465" font-size="18" fill="#0f172a" text-anchor="start">Model / tokenizer revision + hashes</text><text x="555" y="503" font-size="18" fill="#0f172a" text-anchor="start">Engine flags + precision + build profile</text><text x="555" y="541" font-size="18" fill="#0f172a" text-anchor="start">Target GPU + compatible host driver</text><rect x="35" y="580" width="250" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="607" font-size="18" fill="#0f172a" text-anchor="middle">Prepared NIM / engine image</text><path d="M285,612 L350,612" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="350" y="580" width="260" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="607" font-size="18" fill="#0f172a" text-anchor="middle">Same compatibility checks</text><path d="M610,612 L675,612" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="675" y="580" width="270" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="810.0" y="607" font-size="18" fill="#0f172a" text-anchor="middle">Custom image / extra control</text></g></svg>