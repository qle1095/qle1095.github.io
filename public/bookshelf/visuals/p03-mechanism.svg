<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 745" width="1000" height="745" role="img" aria-labelledby="title desc"><title id="title">Speech recognition has two scheduling paths</title><desc id="desc">Live audio is chunked by VAD and transcribed in sequence with optional previous-text conditioning. Offline audio chunks fan out to parallel ASR workers and are ordered by timestamps. Separate diarization intervals label speakers. For 3600 seconds of audio, 36 seconds model plus 12 seconds other work gives RTF 0.0133 and RTFx 75.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="745" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Speech recognition has two scheduling paths</text><text x="35" y="80" font-size="21" fill="#0f172a" text-anchor="start">Live path: chunk latency and sequential context</text><rect x="30" y="110" width="160" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="110.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Audio stream</text><rect x="225" y="110" width="160" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="305.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">VAD + chunk</text><rect x="420" y="110" width="160" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">ASR chunk 1</text><rect x="615" y="110" width="160" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="695.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">ASR chunk 2</text><rect x="810" y="110" width="160" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="890.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Text stream</text><path d="M190,140 L225,140" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M385,140 L420,140" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M580,140 L615,140" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M775,140 L810,140" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="410" y="202" font-size="17" fill="#0f172a" text-anchor="start">Previous transcript may condition the next chunk</text><text x="35" y="247" font-size="21" fill="#0f172a" text-anchor="start">Offline path: parallel work, then timestamp order</text><rect x="30" y="300" width="170" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="115.0" y="327" font-size="18" fill="#0f172a" text-anchor="middle">Long recording</text><text x="115.0" y="351" font-size="18" fill="#0f172a" text-anchor="middle">VAD / chunker</text><path d="M200,335 L285,305" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="285" y="280" width="220" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="395.0" y="307" font-size="18" fill="#0f172a" text-anchor="middle">ASR chunk A</text><path d="M505,305 L605,385" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M200,335 L285,395" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="285" y="370" width="220" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="395.0" y="397" font-size="18" fill="#0f172a" text-anchor="middle">ASR chunk B</text><path d="M505,395 L605,385" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M200,335 L285,485" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="285" y="460" width="220" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="395.0" y="487" font-size="18" fill="#0f172a" text-anchor="middle">ASR chunk C</text><path d="M505,485 L605,385" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="605" y="350" width="165" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="687.5" y="377" font-size="18" fill="#0f172a" text-anchor="middle">Stitch results</text><text x="687.5" y="401" font-size="18" fill="#0f172a" text-anchor="middle">by timestamp</text><path d="M770,390 L810,390" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="810" y="350" width="160" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="890.0" y="377" font-size="18" fill="#0f172a" text-anchor="middle">Transcript</text><text x="890.0" y="401" font-size="18" fill="#0f172a" text-anchor="middle">what was said</text><text x="35" y="565" font-size="21" fill="#0f172a" text-anchor="start">Independent diarization: who spoke when</text><rect x="35" y="585" width="250" height="35" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="285" y="585" width="170" height="35" rx="8" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><rect x="455" y="585" width="250" height="35" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="80" y="609" font-size="17" fill="#0f172a" text-anchor="start">Speaker A</text><text x="318" y="609" font-size="17" fill="#0f172a" text-anchor="start">Speaker B</text><text x="510" y="609" font-size="17" fill="#0f172a" text-anchor="start">Speaker A</text><text x="730" y="610" font-size="17" fill="#0f172a" text-anchor="start">Align intervals to words</text><text x="35" y="674" font-size="22" fill="#0f172a" text-anchor="start">3,600 s audio / (36 s model + 12 s other) = 75× RTFx</text><text x="35" y="707" font-size="18" fill="#0f172a" text-anchor="start">RTF = 48 / 3,600 = 0.0133; include the full processing boundary.</text></g></svg>