<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 795" width="1000" height="795" role="img" aria-labelledby="title desc"><title id="title">Failover needs capacity and an eligible destination</title><desc id="desc">Two regions each serve 80 requests/s with safe capacity 100. After one fails, demand is 160 against surviving capacity 100, leaving a 60 requests/s deficit. A failure-domain diagram distinguishes GPU, node and region. A data-boundary map permits failover only among eligible regions and places prompts, weights and credentials behind separate controls.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="795" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Failover needs capacity and an eligible destination</text><text x="35" y="82" font-size="20" fill="#0f172a" text-anchor="start">Two-region example: active/active does not create failover headroom.</text><rect x="35" y="107" width="425" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="247.5" y="134" font-size="18" fill="#0f172a" text-anchor="middle">A: safe 100 requests/s; serving 80</text><text x="247.5" y="158" font-size="18" fill="#0f172a" text-anchor="middle">A fails → B receives the combined 160</text><rect x="535" y="107" width="430" height="80" rx="8" fill="#ccfbf1" stroke="#2563eb" stroke-width="2"/><text x="750.0" y="134" font-size="18" fill="#0f172a" text-anchor="middle">B: safe 100 requests/s; serving 80</text><text x="750.0" y="158" font-size="18" fill="#0f172a" text-anchor="middle">Survives, but capacity is insufficient</text><text x="35" y="236" font-size="18" fill="#0f172a" text-anchor="start">Survivor capacity</text><rect x="250" y="212" width="400" height="30" rx="8" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="670" y="236" font-size="18" fill="#0f172a" text-anchor="start">100 requests/s</text><text x="35" y="284" font-size="18" fill="#0f172a" text-anchor="start">Offered demand</text><rect x="250" y="260" width="400" height="30" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="650" y="260" width="240" height="30" rx="8" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="680" y="316" font-size="17" fill="#0f172a" text-anchor="start">60 requests/s deficit</text><text x="35" y="361" font-size="20" fill="#0f172a" text-anchor="start">Failure domains: shared dependencies fail together</text><rect x="35" y="384" width="420" height="225" rx="8" fill="none" stroke="#475569" stroke-width="2"/><text x="50" y="412" font-size="18" fill="#0f172a" text-anchor="start">Region / cluster</text><rect x="60" y="433" width="170" height="150" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="75" y="460" font-size="18" fill="#0f172a" text-anchor="start">Node</text><rect x="78" y="480" width="130" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="143.0" y="507" font-size="18" fill="#0f172a" text-anchor="middle">GPU 0</text><rect x="260" y="453" width="160" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="340.0" y="480" font-size="18" fill="#0f172a" text-anchor="middle">Other node</text><text x="340.0" y="504" font-size="18" fill="#0f172a" text-anchor="middle">Other GPUs</text><text x="525" y="361" font-size="20" fill="#0f172a" text-anchor="start">Failover must satisfy the data policy</text><rect x="510" y="384" width="455" height="225" rx="8" fill="none" stroke="#0f766e" stroke-width="2"/><text x="530" y="415" font-size="18" fill="#0f172a" text-anchor="start">Allowed boundary X</text><rect x="530" y="445" width="180" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="620.0" y="472" font-size="18" fill="#0f172a" text-anchor="middle">Eligible A</text><path d="M710,480 L750,480" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="750" y="445" width="180" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="840.0" y="472" font-size="18" fill="#0f172a" text-anchor="middle">Eligible B</text><text x="530" y="560" font-size="17" fill="#0f172a" text-anchor="start">Outside X: no route under this policy</text><text x="35" y="650" font-size="21" fill="#0f172a" text-anchor="start">Protect three different assets</text><rect x="35" y="677" width="285" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="177.5" y="704" font-size="18" fill="#0f172a" text-anchor="middle">Prompts / outputs</text><text x="177.5" y="728" font-size="18" fill="#0f172a" text-anchor="middle">Access + retention policy</text><rect x="357" y="677" width="285" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="499.5" y="704" font-size="18" fill="#0f172a" text-anchor="middle">Weights / engines</text><text x="499.5" y="728" font-size="18" fill="#0f172a" text-anchor="middle">Artifact integrity + access</text><rect x="679" y="677" width="285" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="821.5" y="704" font-size="18" fill="#0f172a" text-anchor="middle">Compute / credentials</text><text x="821.5" y="728" font-size="18" fill="#0f172a" text-anchor="middle">Isolation + least privilege</text></g></svg>