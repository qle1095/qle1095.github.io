<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">Trade spare compute for fewer decode rounds</title><desc id="desc">Draft tokens A, B, C, D are verified in parallel. A and B are accepted, C rejected, D discarded because it depended on C; a corrected token X is emitted, so three tokens survive. A timing comparison shows 20 ms baseline per token versus 35 ms per speculative iteration: accepting two drafts gives 11.67 ms per token; accepting none gives 35 ms.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="580" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Trade spare compute for fewer decode rounds</text><text x="35" y="92" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Candidate continuation: evaluate positions in one causal pass</text><rect x="35" y="125" width="180" height="90" rx="10" fill="#ccfbf1" stroke="#64748b"/><text x="49" y="154" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">A</text><text x="49" y="183" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">accepted</text><rect x="270" y="125" width="180" height="90" rx="10" fill="#ccfbf1" stroke="#64748b"/><text x="284" y="154" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">B</text><text x="284" y="183" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">accepted</text><rect x="505" y="125" width="180" height="90" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="519" y="154" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">C</text><text x="519" y="183" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">first rejection</text><rect x="740" y="125" width="225" height="90" rx="10" fill="#e2e8f0" stroke="#64748b"/><text x="754" y="154" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">D</text><text x="754" y="183" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">discarded suffix</text><path d="M215 170 L270 170" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M450 170 L505 170" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M685 170 L740 170" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="265" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Emitted sequence: A, B, X   (X is target correction)</text><rect x="35" y="315" width="440" height="135" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="49" y="344" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Useful iteration</text><text x="49" y="373" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">2 accepted + 1 correction = 3 tokens</text><text x="49" y="398" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">35 ms / 3 = 11.67 ms per token</text><text x="49" y="423" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Baseline: 20 ms per token</text><rect x="525" y="315" width="440" height="135" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="539" y="344" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Failed first draft</text><text x="539" y="373" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">0 accepted + 1 correction = 1 token</text><text x="539" y="398" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">35 ms / 1 = 35 ms per token</text><text x="539" y="423" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Slower than baseline</text><text x="35" y="505" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Exact sampling needs acceptance + residual correction; likely ≠ valid by itself.</text><text x="35" y="545" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="start">Illustrative timing model. Real costs depend on batch, shape and implementation.</text></g></svg>