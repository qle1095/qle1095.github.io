<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" role="img" aria-labelledby="title desc"><title id="title">Attention mixes values; a KV cache saves old projections</title><desc id="desc">A decoder-only stack maps token embeddings through attention and MLP blocks with normalization and residual updates to vocabulary logits. A causal four-position attention grid allows only past/current positions. The newest cached query needs one row. Scores ln3 and0 normalize to.75 and.25, mixing values2 and10 into4; a masked future value contributes zero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="860" fill="#f8fafc"/><text x="35" y="40" class="title">Attention mixes values; a KV cache saves old projections</text><rect x="40" y="88" width="210" height="74" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="116" class="label">Token embedding</text><text x="54" y="141" class="">+ positional information</text><line x1="250" y1="125" x2="302" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="302" y="88" width="485" height="74" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="316" y="116" class="label">Decoder block, repeated L times</text><text x="316" y="141" class="">Attention + MLP; norms and residual updates</text><line x1="787" y1="125" x2="839" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="839" y="88" width="220" height="74" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="853" y="116" class="label">LM head</text><text x="853" y="141" class="">Vocabulary logits</text><text x="40" y="202" class="small">Schematic decoder-only path; exact norm/position layout depends on model configuration.</text><text x="40" y="245" class="label">FULL CAUSAL ATTENTION</text><text x="490" y="245" class="label">CACHED SINGLE-TOKEN DECODE</text><rect x="105" y="280" width="47" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="160" y="280" width="47" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="175" y="307" class="">×</text><rect x="215" y="280" width="47" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="230" y="307" class="">×</text><rect x="270" y="280" width="47" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="285" y="307" class="">×</text><rect x="105" y="328" width="47" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="160" y="328" width="47" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="215" y="328" width="47" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="230" y="355" class="">×</text><rect x="270" y="328" width="47" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="285" y="355" class="">×</text><rect x="105" y="376" width="47" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="160" y="376" width="47" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="215" y="376" width="47" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="270" y="376" width="47" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="285" y="403" class="">×</text><rect x="105" y="424" width="47" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="160" y="424" width="47" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="215" y="424" width="47" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="270" y="424" width="47" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="590" y="362" width="73" height="45" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="675" y="362" width="73" height="45" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="760" y="362" width="73" height="45" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="845" y="362" width="73" height="45" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="382" class="">Q</text><text x="142" y="501" class="">K positions</text><text x="530" y="392" class="">q new</text><text x="588" y="443" class="">Reuse all available K/V positions</text><text x="490" y="487" class="">Q: 1 × d; K,V: N × d; scores: 1 × N</text><text x="40" y="539" class="label">An N-row prefill is not the same operation as one new query row.</text><line x1="40" y1="570" x2="1060" y2="570" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="610" class="label">ORIGINAL ONE-DIMENSIONAL HEAD EXAMPLE</text><rect x="40" y="640" width="275" height="93" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="668" class="label">Allowed score logits</text><text x="54" y="693" class="">[ln(3), 0] → [0.75, 0.25]</text><line x1="315" y1="686" x2="372" y2="686" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="372" y="640" width="250" height="93" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="386" y="668" class="label">Mix allowed values</text><text x="386" y="693" class="">0.75×2 + 0.25×10</text><line x1="622" y1="686" x2="679" y2="686" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="679" y="640" width="175" height="93" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="693" y="668" class="label">Output</text><text x="693" y="693" class="">4</text><rect x="890" y="640" width="170" height="93" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="904" y="668" class="label">Future value</text><text x="904" y="693" class="">Masked: 0×100</text><text x="40" y="783" class="">Self-attention: Q/K/V from one sequence. Cross-attention: Q from one, K/V from another.</text><text x="40" y="821" class="small">Cache stores per-layer K and V, not attention weights, output vectors or a ready-made response.</text></svg>