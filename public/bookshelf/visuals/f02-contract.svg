<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">A workload contract connects product promises to serving choices</title><desc id="desc">Online and offline workloads have different deadlines. One user action can fan out into multiple inference calls. Dedicated monthly cost has a fixed floor; shared consumption cost rises with volume. Deployment tenancy and whether model weights are open are independent axes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="760" fill="#f8fafc"/><text x="35" y="40" class="title">A workload contract connects product promises to serving choices</text><rect x="40" y="80" width="450" height="95" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="108" class="label">Online: interactive dictation</text><text x="54" y="133" class="">Deadline per utterance; bursty arrival rate</text><rect x="580" y="80" width="480" height="95" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="594" y="108" class="label">Offline: nightly transcription</text><text x="594" y="133" class="">Deadline for the whole job; large batches</text><line x1="265" y1="175" x2="265" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="820" y1="175" x2="820" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="228" width="1020" height="85" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="54" y="256" class="label">Contract: quality gate + latency/job deadline + load distribution + cost + data rules</text><text x="54" y="281" class="">Same model can need two deployment policies. The distinction is the workload, not its name.</text><rect x="40" y="363" width="175" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="391" class="label">User action</text><line x1="215" y1="394" x2="280" y2="361" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="215" y1="394" x2="280" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="215" y1="394" x2="280" y2="479" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="335" width="180" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="294" y="363" class="label">Model call A</text><rect x="280" y="394" width="180" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="294" y="422" class="label">Model call B</text><rect x="280" y="453" width="180" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="294" y="481" class="label">Model call C</text><text x="40" y="545" class="label">1 user action ≠ 1 inference request</text><line x1="585" y1="540" x2="1040" y2="540" stroke="#0f172a" stroke-width="2"/><line x1="585" y1="540" x2="585" y2="350" stroke="#0f172a" stroke-width="2"/><line x1="585" y1="540" x2="995" y2="360" stroke="#2563eb" stroke-width="4"/><line x1="585" y1="424" x2="1040" y2="424" stroke="#0f766e" stroke-width="4"/><text x="608" y="352" class="label">Cost / month</text><text x="670" y="402" class="small">Dedicated cost floor</text><text x="850" y="465" class="small">Shared: per use</text><text x="700" y="573" class="">Monthly volume</text><text x="600" y="606" class="small">Illustrative only: operating costs also matter.</text><text x="40" y="623" class="label">TWO INDEPENDENT QUESTIONS</text><rect x="40" y="650" width="490" height="70" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="54" y="678" class="label">Tenancy: shared or dedicated?</text><rect x="570" y="650" width="490" height="70" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="584" y="678" class="label">Model access: open or closed weights?</text></svg>