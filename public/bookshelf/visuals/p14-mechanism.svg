<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-labelledby="title desc"><title id="title">GPU-hour savings are not automatically total savings</title><desc id="desc">The source example totals $1250 input plus $5000 output, or $6250 API cost. Dedicated GPU-only cost is $5600. Adding a hypothetical $1200 of operating costs makes dedicated TCO $6800; the original margin was only $650. A capacity-over-time sketch distinguishes full offline batches from sparse requests requiring warm idle GPUs.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="750" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">GPU-hour savings are not automatically total savings</text><text x="35" y="82" font-size="20" fill="#0f172a" text-anchor="start">Matched workload: source input/output volume and GPU-hour example</text><text x="35" y="140" font-size="19" fill="#0f172a" text-anchor="start">API</text><rect x="205" y="111" width="125.0" height="42" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="330" y="111" width="500.0" height="42" rx="8" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="845" y="139" font-size="19" fill="#0f172a" text-anchor="start">$6,250</text><text x="205" y="181" font-size="17" fill="#0f172a" text-anchor="start">Input $1,250</text><text x="540" y="181" font-size="17" fill="#0f172a" text-anchor="start">Output $5,000</text><text x="35" y="229" font-size="19" fill="#0f172a" text-anchor="start">GPU only</text><rect x="205" y="201" width="560.0" height="42" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="790" y="230" font-size="19" fill="#0f172a" text-anchor="start">$5,600</text><text x="35" y="307" font-size="19" fill="#0f172a" text-anchor="start">Dedicated TCO</text><rect x="205" y="280" width="560.0" height="42" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="765" y="280" width="120.0" height="42" rx="8" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="900" y="309" font-size="19" fill="#0f172a" text-anchor="start">$6,800</text><text x="600" y="350" font-size="17" fill="#0f172a" text-anchor="middle">Hypothetical operating costs: +$1,200</text><text x="35" y="403" font-size="22" fill="#0f172a" text-anchor="start">GPU-only margin: $6,250 − $5,600 = $650</text><text x="35" y="437" font-size="19" fill="#0f172a" text-anchor="start">That $650 must cover all additional dedicated-service costs.</text><text x="35" y="483" font-size="21" fill="#0f172a" text-anchor="start">Utilization shape changes the economics</text><text x="35" y="530" font-size="18" fill="#0f172a" text-anchor="start">Offline batch</text><text x="35" y="615" font-size="18" fill="#0f172a" text-anchor="start">Sparse online</text><rect x="225" y="505" width="60" height="34" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="294" y="505" width="60" height="34" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="363" y="505" width="60" height="34" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="432" y="505" width="60" height="34" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="501" y="505" width="60" height="34" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="570" y="505" width="60" height="34" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="639" y="505" width="60" height="34" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="708" y="505" width="60" height="34" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="777" y="505" width="60" height="34" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="846" y="505" width="60" height="34" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="225" y="590" width="60" height="34" rx="8" fill="#2563eb" stroke="#475569" stroke-width="2"/><rect x="294" y="590" width="60" height="34" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><rect x="363" y="590" width="60" height="34" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><rect x="432" y="590" width="60" height="34" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><rect x="501" y="590" width="60" height="34" rx="8" fill="#2563eb" stroke="#475569" stroke-width="2"/><rect x="570" y="590" width="60" height="34" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><rect x="639" y="590" width="60" height="34" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><rect x="708" y="590" width="60" height="34" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><rect x="777" y="590" width="60" height="34" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><rect x="846" y="590" width="60" height="34" rx="8" fill="#2563eb" stroke="#475569" stroke-width="2"/><text x="225" y="570" font-size="17" fill="#0f172a" text-anchor="start">Useful work can fill the run, then capacity can stop.</text><text x="225" y="655" font-size="17" fill="#0f172a" text-anchor="start">Idle warm capacity can still be needed for first-request latency.</text><text x="35" y="708" font-size="20" fill="#0f172a" text-anchor="start">Compare equal quality, SLOs, accounting scope, and billing horizon.</text></g></svg>