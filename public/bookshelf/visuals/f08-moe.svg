<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Active parameters describe a path; total weights describe storage</title><desc id="desc">Two tokens route to different two-of-four expert subsets at one layer. The union of touched experts can be all four while each token still uses only two. Total235B parameters at2 bytes need470GB raw storage even if22B parameters are active per token. Expert distribution adds routing and load-balance costs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="720" fill="#f8fafc"/><text x="35" y="40" class="title">Active parameters describe a path; total weights describe storage</text><text x="40" y="83" class="label">SCHEMATIC: select two of four experts at one layer</text><rect x="40" y="124" width="195" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="152" class="label">Token A</text><rect x="40" y="287" width="195" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="315" class="label">Token B</text><rect x="300" y="196" width="170" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="314" y="224" class="label">Router</text><text x="314" y="249" class="">Per token / layer</text><line x1="235" y1="160" x2="300" y2="221" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="235" y1="320" x2="300" y2="247" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="118" width="230" height="75" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="564" y="146" class="label">Expert 1</text><text x="564" y="171" class="">Resident weights</text><rect x="820" y="118" width="230" height="75" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="834" y="146" class="label">Expert 2</text><text x="834" y="171" class="">Resident weights</text><rect x="550" y="294" width="230" height="75" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="564" y="322" class="label">Expert 3</text><text x="564" y="347" class="">Resident weights</text><rect x="820" y="294" width="230" height="75" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="834" y="322" class="label">Expert 4</text><text x="834" y="347" class="">Resident weights</text><line x1="470" y1="218" x2="550" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 216 H505 V98 H800 V155 H820" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="470" y1="250" x2="550" y2="331" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 251 H505 V430 H800 V331 H820" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="573" y="225" class="">A uses experts 1 + 2</text><text x="573" y="402" class="">B uses experts 3 + 4</text><text x="40" y="453" class="label">Batch union = all four experts; each token still executes only its selected pair.</text><line x1="40" y1="485" x2="1060" y2="485" stroke="#cbd5e1" stroke-width="2"/><rect x="40" y="522" width="485" height="107" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="550" class="label">Raw weight capacity: use TOTAL count</text><text x="54" y="575" class="">235 billion × 2 bytes = 470 GB</text><text x="54" y="600" class="">KV, activations and runtime overhead are extra.</text><rect x="570" y="522" width="490" height="107" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="584" y="550" class="label">Per-token expert work: use ACTIVE path</text><text x="584" y="575" class="">22B active is not a 44 GB resident model.</text><text x="584" y="600" class="">Actual memory/traffic also depends on placement.</text><text x="40" y="680" class="small">Multi-GPU expert placement: dispatch → execute selected experts → combine; balance and links matter.</text></svg>