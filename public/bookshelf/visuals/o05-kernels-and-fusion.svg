<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Follow an operation through CUDA</title><desc id="desc">Two unfused kernels each read and write a 4 MB vector, totaling 16 MB; a fused kernel reads and writes once, totaling 8 MB. Separate launch arrows distinguish CUDA graph replay, which can reduce launch overhead without eliminating intermediate memory, from actual fusion.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Follow an operation through CUDA</text><text x="30" y="95" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Unfused: two launches, intermediate write + read</text><rect x="30" y="120" width="180" height="95" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="149" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">VRAM input</text><text x="44" y="178" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">4 MB vector</text><rect x="290" y="120" width="180" height="95" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="304" y="149" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Kernel ×2</text><text x="304" y="178" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">read + write</text><rect x="550" y="120" width="180" height="95" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="564" y="149" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">VRAM temp</text><text x="564" y="178" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">4 MB vector</text><rect x="800" y="120" width="170" height="95" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="814" y="149" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Kernel ×3</text><text x="814" y="178" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">read + write</text><path d="M210 165 L290 165" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M470 165 L550 165" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M730 165 L800 165" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="250" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="start">Reads 8 MB + writes 8 MB = 16 MB modeled traffic</text><text x="30" y="315" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Fused: one launch, no full intermediate array</text><rect x="30" y="345" width="180" height="95" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="374" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">VRAM input</text><text x="44" y="403" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">4 MB vector</text><rect x="340" y="345" width="290" height="95" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="354" y="374" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Fused kernel ×6</text><text x="354" y="403" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">read once, write once</text><rect x="790" y="345" width="180" height="95" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="804" y="374" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">VRAM output</text><text x="804" y="403" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">4 MB vector</text><path d="M210 390 L340 390" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M630 390 L790 390" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="485" font-size="19" fill="#0f172a" font-weight="normal" text-anchor="start">Reads 4 MB + writes 4 MB = 8 MB; cache and other overhead omitted</text><text x="35" y="530" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="start">Graph replay can reduce launch overhead without fusing the top two kernels.</text></g></svg>