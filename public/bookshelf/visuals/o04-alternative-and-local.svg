<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Compare accelerators and local-cloud placement</title><desc id="desc">An offline-sensitive speech request runs through an on-device model; a large document request uses a permitted cloud path. An MoE bar distinguishes all stored experts from the subset active for one token.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Compare accelerators and local-cloud placement</text><rect x="30" y="90" width="280" height="90" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Speech chunk</text><text x="44" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Offline requirement</text><rect x="385" y="90" width="260" height="90" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="399" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">On-device model</text><text x="399" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">180 ms example path</text><rect x="725" y="90" width="245" height="90" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="739" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Local result</text><text x="739" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">No network required</text><path d="M310 135 L385 135" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M645 135 L725 135" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="220" width="280" height="90" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="249" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Long document</text><text x="44" y="278" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Large memory demand</text><rect x="385" y="220" width="260" height="90" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="399" y="249" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Permitted cloud route</text><text x="399" y="278" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Network + queue + compute</text><rect x="725" y="220" width="245" height="90" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="739" y="249" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Cloud result</text><text x="739" y="278" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Offline unavailable</text><path d="M310 265 L385 265" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M645 265 L725 265" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="370" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Hardware gate: fit → operation support → quality → latency / cost</text><text x="35" y="415" font-size="19" fill="#0f172a" font-weight="normal" text-anchor="start">MoE total storage: all experts need a placement plan</text><rect x="35" y="440" width="850" height="34" fill="#cbd5e1"/><rect x="35" y="440" width="170" height="34" fill="#0f766e"/><text x="35" y="508" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Active experts for one token</text><text x="355" y="508" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Inactive now ≠ absent from storage</text></g></svg>