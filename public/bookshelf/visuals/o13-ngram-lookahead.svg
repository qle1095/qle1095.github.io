<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Use repeated tokens as candidate drafts</title><desc id="desc">A toy prompt contains return old_name(x). Looking up return proposes the tokens old_name, left parenthesis, x and right parenthesis but the requested edit needs new_name. The first proposed token is rejected, dependent suffix discarded, and the target emits new_name. A lower comparison distinguishes prompt lookup from lookahead, which generates candidate n-grams with extra parallel computation before verification.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Use repeated tokens as candidate drafts</text><rect x="30" y="85" width="940" height="95" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="114" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Observed prompt tokens</text><text x="44" y="143" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">return   |   old_name   |   (   |   x   |   )</text><rect x="30" y="235" width="270" height="115" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="264" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Lookup key</text><text x="44" y="293" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Generated: return</text><text x="44" y="318" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Retrieve old suffix</text><rect x="365" y="235" width="285" height="115" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="379" y="264" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Proposed suffix</text><text x="379" y="293" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">old_name, (, x, )</text><text x="379" y="318" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">First token now wrong</text><rect x="715" y="235" width="255" height="115" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="729" y="264" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Target continuation</text><text x="729" y="293" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Emit new_name</text><text x="729" y="318" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Discard dependent suffix</text><path d="M300 290 L365 290" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M650 290 L715 290" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="410" width="445" height="110" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="439" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Prompt lookup</text><text x="44" y="468" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Candidates from repeated existing text</text><text x="44" y="493" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Little drafting compute, task-dependent</text><rect x="525" y="410" width="445" height="110" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="539" y="439" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Lookahead</text><text x="539" y="468" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Candidates from extra parallel iterations</text><text x="539" y="493" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Then verify under accepted context</text></g></svg>