<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="title desc"><title id="title">Diffusion: distinguish efficiency from approximation</title><desc id="desc">A profiling ladder moves from excess launches and memory traffic toward useful tensor computation. A 50-step CFG timeline has two evaluations for the first 30 steps and one for the last 20, reducing 100 evaluations to 80. A normalized time bar shows 20 percent unchanged work plus 64 percent denoising work, totaling 84 percent; a quality gate checks the approximated output.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="700" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Diffusion: distinguish efficiency from approximation</text><text x="35" y="82" font-size="21" fill="#0f172a" text-anchor="start">Same intended computation: profile the limiting resource</text><rect x="35" y="112" width="270" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="139" font-size="18" fill="#0f172a" text-anchor="middle">Many small kernels</text><text x="170.0" y="163" font-size="18" fill="#0f172a" text-anchor="middle">intermediate HBM traffic</text><path d="M305,153 L365,153" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="365" y="112" width="270" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="139" font-size="18" fill="#0f172a" text-anchor="middle">Fusion + efficient attention</text><text x="500.0" y="163" font-size="18" fill="#0f172a" text-anchor="middle">fewer transfers / launches</text><path d="M635,153 L695,153" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="695" y="112" width="270" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="830.0" y="139" font-size="18" fill="#0f172a" text-anchor="middle">Efficient GEMM</text><text x="830.0" y="163" font-size="18" fill="#0f172a" text-anchor="middle">test compute ceiling</text><text x="35" y="240" font-size="21" fill="#0f172a" text-anchor="start">Approximation: CFG cutoff changes work and may change quality</text><text x="35" y="280" font-size="18" fill="#0f172a" text-anchor="start">Baseline: 50 steps, two evaluations per step = 100</text><rect x="35" y="300" width="900" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="485" y="328" font-size="19" fill="#0f172a" text-anchor="middle">2 evaluations / step throughout</text><text x="35" y="387" font-size="18" fill="#0f172a" text-anchor="start">Cutoff: first 30 steps × 2 + last 20 steps × 1 = 80</text><rect x="35" y="408" width="540" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="575" y="408" width="180" height="42" rx="8" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="305" y="436" font-size="19" fill="#0f172a" text-anchor="middle">Dual branch: 60 evaluations</text><text x="665" y="436" font-size="19" fill="#0f172a" text-anchor="middle">Single: 20</text><text x="35" y="502" font-size="20" fill="#0f172a" text-anchor="start">If denoising was 80% of total time and savings were proportional:</text><rect x="35" y="530" width="180" height="50" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><rect x="215" y="530" width="576" height="50" rx="8" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="125" y="561" font-size="18" fill="#0f172a" text-anchor="middle">20% other</text><text x="503" y="561" font-size="19" fill="#0f172a" text-anchor="middle">64% denoising after cutoff</text><text x="810" y="562" font-size="23" fill="#0f172a" text-anchor="start">= 84%</text><text x="35" y="626" font-size="19" fill="#0f172a" text-anchor="start">20% fewer evaluations → modeled 16% less total time, not a guarantee.</text><text x="35" y="662" font-size="18" fill="#0f172a" text-anchor="start">Release gate: task detail, prompt adherence, temporal/visual artifacts as applicable.</text></g></svg>