<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">See what low precision saves and loses</title><desc id="desc">FP8 E4M3 splits one sign, four exponent and three fraction bits. A toy symmetric integer quantizer with one scale maps 0.2 and 0.4 to zero because 7 sets the range; separate scaling for the small values preserves approximately 0.229 and 0.4. Storage accounting adds 64 local-scale bytes and 4 global-scale bytes to 512 code bytes, yielding 580 bytes for 1024 values.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="570" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">See what low precision saves and loses</text><text x="35" y="92" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">FP8 E4M3: roles of eight bits</text><rect x="35" y="115" width="115" height="75" rx="10" fill="#cbd5e1" stroke="#64748b"/><text x="49" y="144" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">1 sign</text><rect x="165" y="115" width="350" height="75" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="179" y="144" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">4 exponent bits</text><rect x="530" y="115" width="280" height="75" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="544" y="144" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">3 fraction bits</text><text x="35" y="235" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="start">Toy integer grid: q ∈ {−7, …, +7}; reconstruct x̂ = scale × q</text><rect x="35" y="270" width="435" height="130" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="49" y="299" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">One scale for all values</text><text x="49" y="328" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Values: 0, 0.2, 0.4, 7</text><text x="49" y="353" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Scale = 1 → codes: 0, 0, 0, 7</text><text x="49" y="378" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Small values round to zero</text><rect x="530" y="270" width="435" height="130" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="544" y="299" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Separate small-value scale</text><text x="544" y="328" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Small group scale = 0.4 / 7</text><text x="544" y="353" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Codes: 0, 4, 7</text><text x="544" y="378" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Reconstruct: 0, 0.229, 0.4</text><path d="M470 335 L530 335" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="445" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Example storage for 1024 values</text><rect x="35" y="468" width="700" height="35" fill="#2563eb"/><rect x="735" y="468" width="88" height="35" fill="#0f766e"/><rect x="823" y="468" width="12" height="35" fill="#64748b"/><text x="35" y="534" font-size="19" fill="#0f172a" font-weight="normal" text-anchor="start">512 B codes + 64 B local scales + 4 B global = 580 B</text></g></svg>