<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Fit the workload, not merely the weights</title><desc id="desc">An additive budget separates fixed weights, workspace and reserve from KV state growing with total retained tokens. A worked conventional transformer cache has 32 layers, 8 KV heads, 128 dimensions and 2 bytes/value, producing 128 KiB per token; four 8192-token sequences use 4 GiB. Three remedies are distinguished: FlashAttention reduces intermediate I/O, PagedAttention reduces allocation waste, and chunked prefill changes scheduling, not final KV count.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Fit the workload, not merely the weights</text><text x="35" y="90" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Additive budget: fixed allocations + workload-dependent state</text><rect x="35" y="115" width="420" height="42" fill="#2563eb"/><rect x="455" y="115" width="250" height="42" fill="#0f766e"/><rect x="705" y="115" width="155" height="42" fill="#64748b"/><rect x="860" y="115" width="100" height="42" fill="#cbd5e1"/><text x="60" y="144" font-size="20" fill="white" font-weight="normal" text-anchor="start">Weights</text><text x="480" y="144" font-size="20" fill="white" font-weight="normal" text-anchor="start">KV grows</text><text x="720" y="144" font-size="18" fill="white" font-weight="normal" text-anchor="start">Buffers</text><text x="875" y="144" font-size="16" fill="#0f172a" font-weight="normal" text-anchor="start">Reserve</text><rect x="35" y="200" width="930" height="115" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="49" y="229" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Conventional KV calculation</text><text x="49" y="258" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">2 × 32 layers × 8 KV heads × 128 dimensions × 2 B = 128 KiB per token</text><text x="49" y="283" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">4 × 8192 retained tokens → 4 GiB; double batch and length → 16 GiB</text><rect x="35" y="375" width="285" height="140" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="49" y="404" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">FlashAttention</text><text x="49" y="433" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Avoid large HBM intermediates</text><text x="49" y="458" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Tile / fuse attention</text><text x="49" y="483" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">I/O remedy</text><rect x="355" y="375" width="285" height="140" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="369" y="404" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">PagedAttention</text><text x="369" y="433" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Allocate / share KV blocks</text><text x="369" y="458" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Reduce fragmentation</text><text x="369" y="483" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Allocation remedy</text><rect x="675" y="375" width="290" height="140" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="689" y="404" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Chunked prefill</text><text x="689" y="433" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Schedule prompt pieces</text><text x="689" y="458" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Protect concurrent decode</text><text x="689" y="483" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Scheduling remedy</text></g></svg>