<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 725" width="1000" height="725" role="img" aria-labelledby="title desc"><title id="title">Cold start is a dependency path</title><desc id="desc">A sequential cold-start waterfall totals 20 s GPU provisioning, 8 s image loading, 120 s weights and 40 s engine startup, or 188 s. A second path shows which stages a compatible artifact cache can remove. A scale-to-zero request waits through startup before service; a 5 s deadline expires long before readiness.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="725" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Cold start is a dependency path</text><text x="35" y="82" font-size="21" fill="#0f172a" text-anchor="start">Original sequential example: readiness in 188 seconds</text><text x="35" y="118" font-size="18" fill="#0f172a" text-anchor="start">GPU</text><text x="35" y="178" font-size="18" fill="#0f172a" text-anchor="start">Image</text><text x="35" y="238" font-size="18" fill="#0f172a" text-anchor="start">Weights</text><text x="35" y="298" font-size="18" fill="#0f172a" text-anchor="start">Engine</text><rect x="180" y="95" width="80" height="32" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="220.0" y="150" font-size="17" fill="#0f172a" text-anchor="middle">20 s</text><rect x="260" y="155" width="32" height="32" rx="8" fill="#99f6e4" stroke="#2563eb" stroke-width="2"/><text x="276.0" y="210" font-size="17" fill="#0f172a" text-anchor="middle">8 s</text><rect x="292" y="215" width="480" height="32" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="532.0" y="270" font-size="17" fill="#0f172a" text-anchor="middle">120 s</text><rect x="772" y="275" width="160" height="32" rx="8" fill="#99f6e4" stroke="#2563eb" stroke-width="2"/><text x="852.0" y="330" font-size="17" fill="#0f172a" text-anchor="middle">40 s</text><path d="M180,363 L940,363" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="180" y="390" font-size="16" fill="#0f172a" text-anchor="middle">0 s</text><text x="380" y="390" font-size="16" fill="#0f172a" text-anchor="middle">50 s</text><text x="580" y="390" font-size="16" fill="#0f172a" text-anchor="middle">100 s</text><text x="780" y="390" font-size="16" fill="#0f172a" text-anchor="middle">150 s</text><text x="932" y="390" font-size="16" fill="#0f172a" text-anchor="middle">188 s</text><text x="180" y="424" font-size="20" fill="#0f172a" text-anchor="start">Weights: 240 GB / 2 GB/s = 120 s</text><rect x="35" y="455" width="280" height="83" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="175.0" y="482" font-size="18" fill="#0f172a" text-anchor="middle">Warm node</text><text x="175.0" y="506" font-size="18" fill="#0f172a" text-anchor="middle">Provisioning may be skipped</text><path d="M315,495 L355,495" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="355" y="455" width="280" height="83" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="495.0" y="482" font-size="18" fill="#0f172a" text-anchor="middle">Local weights / image</text><text x="495.0" y="506" font-size="18" fill="#0f172a" text-anchor="middle">Transfer may be skipped</text><path d="M635,495 L675,495" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="675" y="455" width="280" height="83" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="815.0" y="482" font-size="18" fill="#0f172a" text-anchor="middle">Compatible engine cache</text><text x="815.0" y="506" font-size="18" fill="#0f172a" text-anchor="middle">Rebuild may be skipped</text><text x="35" y="580" font-size="18" fill="#0f172a" text-anchor="start">A cache hit is useful only if the artifact is compatible and actually available.</text><path d="M180,643 L932,643" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="180" y="616" width="20" height="20" rx="8" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="180" y="605" font-size="17" fill="#0f172a" text-anchor="start">5 s deadline</text><text x="715" y="605" font-size="17" fill="#0f172a" text-anchor="start">Ready at 188 s</text><text x="35" y="680" font-size="19" fill="#0f172a" text-anchor="start">Scale-to-zero: the first request can arrive before any of these stages start.</text></g></svg>