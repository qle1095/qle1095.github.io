<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 775" width="1000" height="775" role="img" aria-labelledby="title desc"><title id="title">Transport affects the full request path</title><desc id="desc">A request waterfall totals 270 ms from handshake, network, queue, model and client work; session reuse removes only its measured handshake. Three sequence lanes show HTTP incremental output, an accepted asynchronous job with later result delivery, and a persistent bidirectional conversation. Admission, cancellation and duplicate-result handling remain application responsibilities regardless of transport.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="775" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Transport affects the full request path</text><text x="35" y="82" font-size="21" fill="#0f172a" text-anchor="start">Sequential first-output budget in this original example</text><rect x="35" y="112" width="134.0" height="44" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/><text x="102.0" y="181" font-size="17" fill="#0f172a" text-anchor="middle">40 ms</text><text x="102.0" y="105" font-size="16" fill="#0f172a" text-anchor="middle">Handshake</text><rect x="169.0" y="112" width="100.5" height="44" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="219.25" y="181" font-size="17" fill="#0f172a" text-anchor="middle">30 ms</text><text x="219.25" y="105" font-size="16" fill="#0f172a" text-anchor="middle">Network</text><rect x="269.5" y="112" width="201.0" height="44" rx="8" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="370.0" y="181" font-size="17" fill="#0f172a" text-anchor="middle">60 ms</text><text x="370.0" y="105" font-size="16" fill="#0f172a" text-anchor="middle">Queue</text><rect x="470.5" y="112" width="402.0" height="44" rx="8" fill="#99f6e4" stroke="#2563eb" stroke-width="2"/><text x="671.5" y="181" font-size="17" fill="#0f172a" text-anchor="middle">120 ms</text><text x="671.5" y="105" font-size="16" fill="#0f172a" text-anchor="middle">Model</text><rect x="872.5" y="112" width="67.0" height="44" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/><text x="906.0" y="181" font-size="17" fill="#0f172a" text-anchor="middle">20 ms</text><text x="906.0" y="105" font-size="16" fill="#0f172a" text-anchor="middle">Client</text><text x="35" y="223" font-size="20" fill="#0f172a" text-anchor="start">Total 270 ms → session reuse removes 40 ms → 230 ms remains.</text><text x="35" y="269" font-size="20" fill="#0f172a" text-anchor="start">Choose an interaction contract, then implement its failure behavior.</text><text x="175" y="316" font-size="19" fill="#0f172a" text-anchor="middle">HTTP incremental output</text><text x="45" y="355" font-size="17" fill="#0f172a" text-anchor="start">Client</text><text x="235" y="355" font-size="17" fill="#0f172a" text-anchor="start">Service</text><path d="M70,370 L70,650" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M260,370 L260,650" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="497" y="316" font-size="19" fill="#0f172a" text-anchor="middle">Asynchronous job</text><text x="367" y="355" font-size="17" fill="#0f172a" text-anchor="start">Client</text><text x="557" y="355" font-size="17" fill="#0f172a" text-anchor="start">Service</text><path d="M392,370 L392,650" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M582,370 L582,650" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="819" y="316" font-size="19" fill="#0f172a" text-anchor="middle">Bidirectional stream</text><text x="689" y="355" font-size="17" fill="#0f172a" text-anchor="start">Client</text><text x="879" y="355" font-size="17" fill="#0f172a" text-anchor="start">Service</text><path d="M714,370 L714,650" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M904,370 L904,650" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M70,395 L260,395" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="125" y="387" font-size="16" fill="#0f172a" text-anchor="start">Request</text><path d="M260,457 L70,457" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="135" y="447" font-size="16" fill="#0f172a" text-anchor="start">Chunk 1</text><path d="M260,508 L70,508" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="135" y="498" font-size="16" fill="#0f172a" text-anchor="start">Chunk 2</text><path d="M260,579 L70,579" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="130" y="569" font-size="16" fill="#0f172a" text-anchor="start">Complete</text><path d="M392,395 L582,395" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="450" y="387" font-size="16" fill="#0f172a" text-anchor="start">Submit</text><path d="M582,450 L392,450" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="435" y="440" font-size="16" fill="#0f172a" text-anchor="start">Job ID / ack</text><path d="M392,523 L582,523" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="440" y="513" font-size="16" fill="#0f172a" text-anchor="start">Poll / status</text><path d="M582,596 L392,596" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="433" y="583" font-size="16" fill="#0f172a" text-anchor="start">Later result</text><path d="M714,395 L904,395" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M904,450 L714,450" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M714,505 L904,505" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M904,560 L714,560" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M714,615 L904,615" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="750" y="435" font-size="16" fill="#0f172a" text-anchor="start">Input / output</text><text x="756" y="597" font-size="16" fill="#0f172a" text-anchor="start">May overlap</text><text x="35" y="695" font-size="19" fill="#0f172a" text-anchor="start">All contracts need admission, timeout / cancellation, and retry semantics.</text><text x="35" y="733" font-size="19" fill="#0f172a" text-anchor="start">Async delivery also needs durable job state and duplicate-result handling.</text></g></svg>