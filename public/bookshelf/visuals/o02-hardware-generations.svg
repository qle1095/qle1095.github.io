<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Choose hardware features, not a generation trophy</title><desc id="desc">Three hardware changes address different constraints: Hopper memory upgrades help capacity or bandwidth, Ada without NVLink favors workloads with little inter-GPU communication, and Blackwell low precision needs supported representation, kernel and acceptable quality. Historical numbers show 96 GB takes 28.7 ms at 3.35 TB/s versus 20 ms at 4.8 TB/s, assuming bandwidth-only transfer.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Choose hardware features, not a generation trophy</text><text x="35" y="90" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Historical feature example</text><text x="370" y="90" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Potential effect</text><text x="700" y="90" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Verify in your service</text><rect x="30" y="115" width="290" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="144" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">H100 → H200</text><text x="44" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Same book FP8 compute</text><text x="44" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">3.35 → 4.8 TB/s HBM</text><rect x="355" y="115" width="295" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="369" y="144" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Move bytes faster</text><text x="369" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">96 GB: 28.7 → 20.0 ms</text><text x="369" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Ideal bandwidth-only floor</text><rect x="685" y="115" width="285" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="699" y="144" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Decode workload</text><text x="699" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Actual bandwidth + KV</text><text x="699" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Capacity and latency</text><path d="M320 163 L355 163" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M650 163 L685 163" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="245" width="290" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="274" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Ada example</text><text x="44" y="303" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">No NVLink on L4/L40</text><text x="44" y="328" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Small single-GPU model</text><rect x="355" y="245" width="295" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="369" y="274" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Different topology cost</text><text x="369" y="303" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">No cross-GPU collectives</text><text x="369" y="328" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">when one GPU suffices</text><rect x="685" y="245" width="285" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="699" y="274" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Placement decision</text><text x="699" y="303" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Fit and SLA first</text><text x="699" y="328" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Compare total cost</text><path d="M320 293 L355 293" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M650 293 L685 293" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="375" width="290" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="404" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Blackwell example</text><text x="44" y="433" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">FP4 / microscaling</text><text x="44" y="458" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Architecture capability</text><rect x="355" y="375" width="295" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="369" y="404" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Potential byte/math savings</text><text x="369" y="433" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Format → kernel → quality</text><text x="369" y="458" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">All three must work</text><rect x="685" y="375" width="285" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="699" y="404" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Quantized benchmark</text><text x="699" y="433" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Check no fallback path</text><text x="699" y="458" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Measure quality + speed</text><path d="M320 423 L355 423" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M650 423 L685 423" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="30" y="530" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Architecture support is a capability, not an end-to-end speedup guarantee.</text></g></svg>