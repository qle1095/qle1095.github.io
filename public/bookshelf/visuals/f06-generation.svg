<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">One request becomes a loop over token predictions</title><desc id="desc">Chat messages are formatted and tokenized, then prefill processes the prompt and supplies a next-token distribution. Token selection produces one output; cached decode consumes it and extends the key/value cache. Softmax on logits2,1,0 gives approximately.665,.245,.090; top-p.8 retains the first two and renormalizes. Context includes prompt and all generated tokens.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="760" fill="#f8fafc"/><text x="35" y="40" class="title">One request becomes a loop over token predictions</text><rect x="40" y="88" width="225" height="85" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="116" class="label">Messages + tools</text><text x="54" y="141" class="">Apply chat template</text><line x1="265" y1="130" x2="318" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="318" y="88" width="205" height="85" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="332" y="116" class="label">Tokenizer</text><text x="332" y="141" class="">Token IDs</text><line x1="523" y1="130" x2="576" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="88" width="230" height="85" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="590" y="116" class="label">Prefill prompt</text><text x="590" y="141" class="">K/V + next logits</text><line x1="806" y1="130" x2="859" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="859" y="88" width="200" height="85" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="873" y="116" class="label">Select token</text><text x="873" y="141" class="">Emit / stop?</text><rect x="575" y="230" width="484" height="85" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="589" y="258" class="label">Cached decode: process the newest token</text><text x="589" y="283" class="">Append its K/V → compute next-token logits</text><line x1="960" y1="173" x2="960" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="575" y1="272" x2="532" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="532" y1="272" x2="532" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="532" y1="205" x2="919" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="919" y1="205" x2="919" y2="173" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="249" class="">First output can use prefill logits.</text><text x="40" y="282" class="">Stop on EOS or a configured limit.</text><text x="40" y="330" class="small">Cache stores prior key/value projections, not the final answer.</text><line x1="40" y1="360" x2="1060" y2="360" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="399" class="label">ORIGINAL THREE-TOKEN SAMPLING EXAMPLE</text><text x="40" y="461" class="">A</text><rect x="80" y="435" width="312.55" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="410" y="461" class="">0.665</text><text x="40" y="526" class="">B</text><rect x="80" y="500" width="115.14999999999999" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="410" y="526" class="">0.245</text><text x="40" y="591" class="">C</text><rect x="80" y="565" width="42.3" height="36" rx="6" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="410" y="591" class="">0.090</text><text x="570" y="464" class="">Logits [2, 1, 0] → softmax at T = 1</text><text x="570" y="504" class="">Top-p 0.8: A alone is not enough.</text><text x="570" y="544" class="">A + B = 0.910 → retain both.</text><text x="570" y="584" class="label">Renormalized: [0.731, 0.269, 0]</text><text x="40" y="652" class="label">CONTEXT BUDGET</text><rect x="40" y="676" width="1020" height="52" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="54" y="704" class="label">Prompt + generated reasoning (if any) + generated answer ≤ supported context</text></svg>