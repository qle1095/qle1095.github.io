<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Put KV where fetching beats recomputation</title><desc id="desc">A memory hierarchy lists GPU VRAM, host RAM, local SSD and network storage, with increasing capacity opportunities and transfer cost. KV allocation is 80% of 80 GB free, equaling 64 GB. Hot replica A waits 400 ms plus 20 ms work, totaling 420 ms; cold idle B needs 150 ms prefill, so B is faster despite the miss.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Put KV where fetching beats recomputation</text><rect x="35" y="90" width="400" height="215" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="49" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Cache memory tiers</text><text x="49" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">G1: device VRAM, closest to compute</text><text x="49" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">G2: host RAM, CPU-GPU transfer</text><text x="49" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">G3: local SSD, staging needed</text><text x="49" y="223" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">G4: network storage, shared access</text><text x="49" y="248" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Compare effective fetch vs recompute</text><rect x="520" y="90" width="445" height="215" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="534" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Budget remaining memory</text><text x="534" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">180 GB total − 100 GB used = 80 GB</text><text x="534" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">0.8 × 80 GB = 64 GB KV allocation</text><text x="534" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Fraction is not applied to total capacity</text><text x="534" y="223" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Book example; actual usable capacity varies</text><text x="35" y="360" font-size="21" fill="#0f172a" font-weight="bold" text-anchor="start">Original route comparison: cache hit is not the entire latency</text><rect x="35" y="395" width="430" height="120" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="49" y="424" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Hot replica A</text><text x="49" y="453" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">400 ms queue + 20 ms work</text><text x="49" y="478" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">= 420 ms before first token</text><rect x="535" y="395" width="430" height="120" rx="10" fill="#ccfbf1" stroke="#64748b"/><text x="549" y="424" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Cold replica B</text><text x="549" y="453" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">0 ms queue + 150 ms prefill</text><text x="549" y="478" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">= 150 ms before first token</text></g></svg>