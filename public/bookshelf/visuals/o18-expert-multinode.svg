<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc"><title id="title">Place experts and move tokens deliberately</title><desc id="desc">A router sends token representations to selected experts on GPU 0 and GPU 1; outputs return and combine. GPU 0 has 70% of assignments despite equal expert counts, creating a hotspot. A comparison distinguishes TP shards of each expert from EP placement of whole experts, with hybrid attention TP plus expert EP possible. Cross-node links add communication cost rather than automatic throughput.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="630" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Place experts and move tokens deliberately</text><rect x="350" y="80" width="300" height="85" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="364" y="109" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Router + token states</text><text x="364" y="138" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Choose active expert IDs</text><rect x="35" y="240" width="390" height="150" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="49" y="269" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">GPU 0 · whole experts</text><text x="49" y="298" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">E0 … E15</text><text x="49" y="323" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">70% of assignments in example</text><text x="49" y="348" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Potential hotspot</text><rect x="575" y="240" width="390" height="150" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="589" y="269" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">GPU 1 · whole experts</text><text x="589" y="298" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">E16 … E31</text><text x="589" y="323" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">30% of assignments in example</text><text x="589" y="348" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Equal expert count ≠ equal load</text><path d="M390 165 L230 240" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="310.0" y="183" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="middle">dispatch</text><path d="M610 165 L770 240" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="690.0" y="183" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="middle">dispatch</text><rect x="350" y="460" width="300" height="80" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="364" y="489" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Combine outputs</text><text x="364" y="518" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Apply routing weights</text><path d="M230 390 L395 460" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="312.5" y="449" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="middle">return</text><path d="M770 390 L605 460" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="687.5" y="449" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="middle">return</text><text x="35" y="590" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">TP: split each expert tensor   |   EP: place whole experts   |   hybrids combine them</text></g></svg>