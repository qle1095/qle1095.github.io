<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-labelledby="title desc"><title id="title">TTS capacity is limited by the slowest stage</title><desc id="desc">A token generator feeds an audio decoder, then a playback buffer. At 90 tokens per audio second, 2700 tokens/s allows 30 ideal streams, but a decoder producing 22 audio-seconds/s is a lower bottleneck. A separate cascade timeline allocates 760 ms across endpointing, ASR, LLM, TTS and transport; an integrated model must be measured against that boundary.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="690" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">TTS capacity is limited by the slowest stage</text><text x="35" y="80" font-size="21" fill="#0f172a" text-anchor="start">Audio is consumed continuously; every stage must keep up</text><rect x="25" y="115" width="170" height="82" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="110.0" y="142" font-size="18" fill="#0f172a" text-anchor="middle">Text</text><rect x="220" y="115" width="170" height="82" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="305.0" y="142" font-size="18" fill="#0f172a" text-anchor="middle">Token generator</text><text x="305.0" y="166" font-size="18" fill="#0f172a" text-anchor="middle">2,700 tokens/s</text><rect x="415" y="115" width="170" height="82" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="142" font-size="18" fill="#0f172a" text-anchor="middle">Audio decoder</text><text x="500.0" y="166" font-size="18" fill="#0f172a" text-anchor="middle">22 audio-s/s</text><rect x="610" y="115" width="170" height="82" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="695.0" y="142" font-size="18" fill="#0f172a" text-anchor="middle">Playback buffer</text><text x="695.0" y="166" font-size="18" fill="#0f172a" text-anchor="middle">absorbs variation</text><rect x="805" y="115" width="170" height="82" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="890.0" y="142" font-size="18" fill="#0f172a" text-anchor="middle">Playback</text><text x="890.0" y="166" font-size="18" fill="#0f172a" text-anchor="middle">Real-time</text><path d="M195,157 L220,157" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M390,157 L415,157" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M585,157 L610,157" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M780,157 L805,157" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="35" y="245" font-size="21" fill="#0f172a" text-anchor="start">Hypothetical codec: 90 tokens produce 1 audio-second</text><text x="35" y="285" font-size="18" fill="#0f172a" text-anchor="start">Generator ceiling: 30 simultaneous real-time streams</text><rect x="35" y="300" width="780" height="35" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="35" y="367" font-size="18" fill="#0f172a" text-anchor="start">Decoder ceiling: 22 streams before overhead and headroom</text><rect x="35" y="382" width="572" height="35" rx="8" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="645" y="407" font-size="21" fill="#0f172a" text-anchor="start">Pipeline ceiling ≤ 22</text><text x="35" y="458" font-size="19" fill="#0f172a" text-anchor="start">Admission must preserve first useful audio AND uninterrupted playback.</text><text x="35" y="510" font-size="22" fill="#0f172a" text-anchor="start">Example sequential voice-response budget: 760 ms</text><rect x="35" y="535" width="180.0" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="125.0" y="560" font-size="17" fill="#0f172a" text-anchor="middle">VAD</text><text x="125.0" y="585" font-size="17" fill="#0f172a" text-anchor="middle">150 ms</text><rect x="215.0" y="535" width="120.0" height="65" rx="8" fill="#ccfbf1" stroke="#2563eb" stroke-width="2"/><text x="275.0" y="560" font-size="17" fill="#0f172a" text-anchor="middle">ASR</text><text x="275.0" y="585" font-size="17" fill="#0f172a" text-anchor="middle">100 ms</text><rect x="335.0" y="535" width="300.0" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="485.0" y="560" font-size="17" fill="#0f172a" text-anchor="middle">LLM</text><text x="485.0" y="585" font-size="17" fill="#0f172a" text-anchor="middle">250 ms</text><rect x="635.0" y="535" width="216.0" height="65" rx="8" fill="#ccfbf1" stroke="#2563eb" stroke-width="2"/><text x="743.0" y="560" font-size="17" fill="#0f172a" text-anchor="middle">TTS</text><text x="743.0" y="585" font-size="17" fill="#0f172a" text-anchor="middle">180 ms</text><rect x="851.0" y="535" width="96.0" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="899.0" y="560" font-size="17" fill="#0f172a" text-anchor="middle">Network</text><text x="899.0" y="585" font-size="17" fill="#0f172a" text-anchor="middle">80 ms</text><text x="35" y="648" font-size="18" fill="#0f172a" text-anchor="start">Cascade: tune stages independently. Integrated speech: measure the same user outcome.</text></g></svg>