<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="title desc"><title id="title">Embedding service isolation and quality checks</title><desc id="desc">Separate online query and offline corpus queues feed replicas with different waiting and batch policies. Output vectors enter a compatible index. Raw storage scales from 4.096 GB at 1024 float32 dimensions to 1.024 GB at 256. Same-direction arrows of unequal length illustrate that cosine one does not mean equal vectors; validation proceeds from vector drift to retrieval quality.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="700" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Embedding service isolation and quality checks</text><text x="35" y="80" font-size="20" fill="#0f172a" text-anchor="start">Different service goals require different waiting policies</text><rect x="30" y="110" width="180" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Online queries</text><text x="120.0" y="161" font-size="18" fill="#0f172a" text-anchor="middle">short deadline</text><path d="M210,149 L255,149" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="255" y="110" width="220" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="365.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Query queue</text><text x="365.0" y="161" font-size="18" fill="#0f172a" text-anchor="middle">bounded batch wait</text><path d="M475,149 L520,149" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="520" y="110" width="185" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="612.5" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Query replicas</text><text x="612.5" y="161" font-size="18" fill="#0f172a" text-anchor="middle">latency target</text><rect x="30" y="230" width="180" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120.0" y="257" font-size="18" fill="#0f172a" text-anchor="middle">Corpus backfill</text><text x="120.0" y="281" font-size="18" fill="#0f172a" text-anchor="middle">completion deadline</text><path d="M210,269 L255,269" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="255" y="230" width="220" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="365.0" y="257" font-size="18" fill="#0f172a" text-anchor="middle">Bulk queue</text><text x="365.0" y="281" font-size="18" fill="#0f172a" text-anchor="middle">larger batches</text><path d="M475,269 L520,269" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="520" y="230" width="185" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="612.5" y="257" font-size="18" fill="#0f172a" text-anchor="middle">Bulk replicas</text><text x="612.5" y="281" font-size="18" fill="#0f172a" text-anchor="middle">throughput target</text><path d="M705,149 L780,199" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M705,269 L780,219" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="780" y="170" width="190" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="875.0" y="197" font-size="18" fill="#0f172a" text-anchor="middle">Same model space</text><text x="875.0" y="221" font-size="18" fill="#0f172a" text-anchor="middle">compatible index</text><text x="35" y="358" font-size="21" fill="#0f172a" text-anchor="start">Raw storage: 1 million float32 vectors</text><text x="35" y="395" font-size="18" fill="#0f172a" text-anchor="start">1,024 dimensions: 4.096 GB</text><rect x="35" y="409" width="520" height="28" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="35" y="469" font-size="18" fill="#0f172a" text-anchor="start">256 dimensions: 1.024 GB</text><rect x="35" y="483" width="130" height="28" rx="8" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="35" y="549" font-size="17" fill="#0f172a" text-anchor="start">Index + metadata overhead is additional.</text><text x="625" y="358" font-size="20" fill="#0f172a" text-anchor="start">Cosine checks direction</text><path d="M650,510 L910,510" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M650,510 L650,385" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M650,510 L770,440" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M650,510 L890,370" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="775" y="463" font-size="17" fill="#0f172a" text-anchor="start">v and 2v</text><text x="650" y="545" font-size="17" fill="#0f172a" text-anchor="start">Same direction, unequal length</text><rect x="35" y="585" width="270" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="612" font-size="18" fill="#0f172a" text-anchor="middle">Vector drift</text><text x="170.0" y="636" font-size="18" fill="#0f172a" text-anchor="middle">first diagnostic</text><path d="M305,620 L355,620" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="355" y="585" width="270" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="490.0" y="612" font-size="18" fill="#0f172a" text-anchor="middle">Retrieval ranking / recall</text><text x="490.0" y="636" font-size="18" fill="#0f172a" text-anchor="middle">task evidence</text><path d="M625,620 L675,620" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="675" y="585" width="270" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="810.0" y="612" font-size="18" fill="#0f172a" text-anchor="middle">Latency + quality gate</text><text x="810.0" y="636" font-size="18" fill="#0f172a" text-anchor="middle">release decision</text></g></svg>