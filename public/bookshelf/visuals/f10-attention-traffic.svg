<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 830" role="img" aria-labelledby="t d"><title id="t">Attention shapes determine work and traffic</title><desc id="d">A full N by d query matrix produces N by N scores with all keys; cached decode uses one by d query and one by N scores. Three naive kernels write scores and probabilities to HBM then read them again. Full sequence at N4096,d128 is62.42 FLOP per byte; cached single query is0.990 under simplified FP16 accounting.</desc><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.small{font-size:16px}.heading{font-size:25px;font-weight:bold}.label{font-weight:bold}</style><rect width="1100" height="830" fill="#f8fafc"/><text x="40" y="43" class="heading">Full-sequence attention and cached decode have different shapes</text><text x="40" y="74">One head · N = available key positions · d = head width · schematic, not to scale</text><text x="42" y="118" class="label">FULL SEQUENCE: every query row needs an output</text><rect x="60" y="145" width="120" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="101" y="199">Q</text><text x="87" y="228">N × d</text><text x="208" y="211" class="heading">×</text><rect x="260" y="174" width="220" height="62" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="300" y="213">Kᵀ: d × N</text><text x="509" y="211" class="heading">=</text><rect x="558" y="143" width="190" height="126" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><path d="M558 174 H748 M558 205 H748 M558 236 H748 M605 143 V269 M653 143 V269 M700 143 V269" stroke="#94a3b8"/><text x="588" y="297">Scores: N × N</text><text x="791" y="181" class="label">Source example:</text><text x="791" y="214">all N queries</text><text x="791" y="247">not one cached query</text><text x="42" y="344" class="label">CACHED DECODE: only the newest query row</text><rect x="60" y="375" width="120" height="36" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="85" y="402">q: 1 × d</text><text x="208" y="402" class="heading">×</text><rect x="260" y="363" width="220" height="62" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="300" y="402">Kᵀ: d × N</text><text x="509" y="402" class="heading">=</text><rect x="558" y="375" width="190" height="36" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="581" y="401">Scores: 1 × N</text><text x="791" y="383">Reuse past K/V,</text><text x="791" y="412">still read the context.</text><line x1="40" y1="463" x2="1060" y2="463" stroke="#cbd5e1"/><text x="40" y="502" class="heading">Naive implementation pays for intermediate writes and reads</text><rect x="45" y="529" width="175" height="65" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="76" y="556" class="label">Scores</text><text x="76" y="580">S = QKᵀ</text><rect x="273" y="529" width="168" height="65" fill="#fff" stroke="#475569" stroke-dasharray="5 4"/><text x="294" y="556">HBM: S</text><text x="294" y="580" class="small">write → read</text><rect x="494" y="529" width="145" height="65" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="522" y="556" class="label">Softmax</text><text x="522" y="580">P</text><rect x="692" y="529" width="168" height="65" fill="#fff" stroke="#475569" stroke-dasharray="5 4"/><text x="713" y="556">HBM: P</text><text x="713" y="580" class="small">write → read</text><rect x="913" y="529" width="143" height="65" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="941" y="556" class="label">Output</text><text x="941" y="580">O = PV</text><path d="M220 561 H273 M441 561 H494 M639 561 H692 M860 561 H913" stroke="#0f172a" stroke-width="2"/><text x="45" y="632" class="small">Fused / tiled kernels change this HBM traffic ledger; these estimates do not describe every implementation.</text><rect x="45" y="659" width="480" height="104" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="66" y="689" class="label">Full sequence: N = 4096, d = 128</text><text x="66" y="718">8,640,266,240 FLOPs / 138,412,032 bytes</text><text x="66" y="748" class="label">≈ 62.42 FLOP/byte</text><rect x="556" y="659" width="500" height="104" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="577" y="689" class="label">Added comparison: one cached query</text><text x="577" y="718">2,109,440 FLOPs / 2,130,432 bytes</text><text x="577" y="748" class="label">≈ 0.990 FLOP/byte</text><text x="45" y="797" class="small">FP16 stored values; softmax ≈ 3 operations/element; projections, weights and other layers omitted.</text></svg>