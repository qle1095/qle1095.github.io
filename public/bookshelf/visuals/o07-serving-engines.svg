<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Choose an engine with measured evidence</title><desc id="desc">Requests enter an optional distributed router, then engine schedulers and KV managers, then kernels and hardware. A continuous-batching trace shows a finished request replaced while another continues. Candidate selection gates support, correctness and measured SLO-goodput before choosing orchestration complexity.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Choose an engine with measured evidence</text><rect x="30" y="90" width="275" height="115" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Optional orchestration</text><text x="44" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Route across workers</text><text x="44" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Move / locate KV state</text><rect x="365" y="90" width="275" height="115" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="379" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Inference engine</text><text x="379" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Schedule active requests</text><text x="379" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Manage KV and execution</text><rect x="700" y="90" width="270" height="115" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="714" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Kernel + hardware</text><text x="714" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Execute supported ops</text><text x="714" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Compute and move bytes</text><path d="M305 145 L365 145" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M640 145 L700 145" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="270" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Continuous batching: request A finishes; C can enter</text><rect x="35" y="300" width="240" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="49" y="329" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Iteration 1</text><text x="49" y="358" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">A token · B token</text><rect x="365" y="300" width="240" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="379" y="329" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Iteration 2</text><text x="379" y="358" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">A finishes · B token</text><rect x="700" y="300" width="270" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="714" y="329" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Iteration 3</text><text x="714" y="358" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">C token · B token</text><path d="M275 345 L365 345" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M605 345 L700 345" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="460" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="start">Selection gates: model / format support → quality → SLO-goodput / cost</text><text x="35" y="515" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">A universal engine ranking skips the workload that determines the result.</text></g></svg>