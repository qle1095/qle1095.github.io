<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc"><title id="title">Follow the shapes and the values</title><desc id="desc">An original two-dimensional example multiplies input[1,2] by weights[[1,-2],[2,1]] and adds bias[0,-1], giving[5,-1]. ReLU changes this to[5,0]. A second affine layer produces6 with ReLU but4 without it. Tokens, hidden vectors, weights and outputs have different roles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="740" fill="#f8fafc"/><text x="35" y="40" class="title">Follow the shapes and the values</text><text x="40" y="84" class="label">ORIGINAL NUMERIC EXAMPLE · row-vector convention</text><rect x="40" y="111" width="180" height="95" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="139" class="label">Input x: 1 × 2</text><text x="54" y="164" class="">[1, 2]</text><text x="243" y="164" class="title">×</text><rect x="290" y="111" width="260" height="95" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="304" y="139" class="label">Weights W: 2 × 2</text><text x="304" y="164" class="">[[1, −2], [2, 1]]</text><text x="578" y="164" class="title">+</text><rect x="625" y="111" width="190" height="95" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="639" y="139" class="label">Bias: 1 × 2</text><text x="639" y="164" class="">[0, −1]</text><line x1="815" y1="158" x2="870" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="885" y="111" width="175" height="95" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="899" y="139" class="label">y: 1 × 2</text><text x="899" y="164" class="">[5, −1]</text><text x="40" y="250" class="small">First output: 1×1 + 2×2 + 0 = 5; second output: 1×(−2) + 2×1 − 1 = −1.</text><rect x="40" y="295" width="210" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="323" class="label">Affine output</text><text x="54" y="348" class="">[5, −1]</text><line x1="250" y1="336" x2="320" y2="336" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="295" width="275" height="80" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="334" y="323" class="label">ReLU: max(0, value)</text><text x="334" y="348" class="">[5, 0]</text><line x1="595" y1="336" x2="665" y2="336" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="665" y="295" width="395" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="679" y="323" class="label">Second layer: [1, 2]ᵀ and bias 1</text><text x="679" y="348" class="">With ReLU: 5×1 + 0×2 + 1 = 6</text><text x="40" y="418" class="small">Without ReLU: 5×1 + (−1)×2 + 1 = 4 → one affine map can represent this whole path.</text><line x1="40" y1="456" x2="1060" y2="456" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="496" class="label">REPRESENTATIONS ARE DATA; WEIGHTS ARE THE TRANSFORMATION</text><rect x="40" y="528" width="195" height="75" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="556" class="label">Token ID</text><text x="54" y="581" class="">Integer symbol</text><line x1="235" y1="564" x2="287" y2="564" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="287" y="528" width="230" height="75" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="301" y="556" class="label">Embedding / hidden</text><text x="301" y="581" class="">Vector of features</text><line x1="517" y1="564" x2="572" y2="564" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="572" y="528" width="230" height="75" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="586" y="556" class="label">Further layers</text><text x="586" y="581" class="">Updated vectors</text><line x1="802" y1="564" x2="857" y2="564" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="857" y="528" width="203" height="75" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="871" y="556" class="label">Output scores</text><text x="871" y="581" class="">Logits / prediction</text><text x="40" y="649" class="">Encoder: input → representation; decoder: representation/context → output predictions.</text><text x="40" y="688" class="small">Normal inference changes hidden states for the input, not the learned model parameters.</text></svg>