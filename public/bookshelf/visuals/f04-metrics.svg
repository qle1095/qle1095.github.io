<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">A token stream has several clocks</title><desc id="desc">A single request begins at0 seconds, produces first token at0.20 and five tokens by0.30. Four intervals over0.10 seconds give40 tokens per second after first token. A sorted latency population has eight100ms samples, one200ms and one1000ms, making mean200ms, median100ms and nearest-rank p90 200ms. End-to-end time includes queue, network and GPU work.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="720" fill="#f8fafc"/><text x="35" y="40" class="title">A token stream has several clocks</text><text x="40" y="73" class="label">ORIGINAL TRACE: five output tokens</text><line x1="115" y1="150" x2="1005" y2="150" stroke="#0f172a" stroke-width="2"/><line x1="115" y1="140" x2="115" y2="160" stroke="#0f172a" stroke-width="2"/><text x="95" y="190" class="">0.00</text><line x1="675" y1="140" x2="675" y2="160" stroke="#0f172a" stroke-width="2"/><text x="655" y="190" class="">0.20</text><line x1="731" y1="140" x2="731" y2="160" stroke="#0f172a" stroke-width="2"/><text x="711" y="190" class="">0.22</text><line x1="815" y1="140" x2="815" y2="160" stroke="#0f172a" stroke-width="2"/><text x="795" y="190" class="">0.25</text><line x1="871" y1="140" x2="871" y2="160" stroke="#0f172a" stroke-width="2"/><text x="851" y="190" class="">0.27</text><line x1="955" y1="140" x2="955" y2="160" stroke="#0f172a" stroke-width="2"/><text x="935" y="190" class="">0.30</text><circle cx="675" cy="150" r="8" fill="#2563eb"/><circle cx="731" cy="150" r="8" fill="#2563eb"/><circle cx="815" cy="150" r="8" fill="#2563eb"/><circle cx="871" cy="150" r="8" fill="#2563eb"/><circle cx="955" cy="150" r="8" fill="#2563eb"/><text x="40" y="226" class="">Time (seconds)</text><line x1="115" y1="112" x2="675" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="290" y="98" class="label">TTFT = 0.20 s</text><line x1="675" y1="235" x2="955" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="647" y="269" class="label">4 gaps / 0.10 s = 40 token/s</text><text x="40" y="304" class="small">Total completion latency = 0.30 s; aggregate service TPS needs its own observation window.</text><line x1="40" y1="333" x2="1060" y2="333" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="372" class="label">SORTED LATENCIES: nearest-rank percentile convention</text><rect x="40" y="410" width="87" height="55" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="54" y="444" class="">100</text><text x="65" y="494" class="small">1</text><rect x="142" y="410" width="87" height="55" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="156" y="444" class="">100</text><text x="167" y="494" class="small">2</text><rect x="244" y="410" width="87" height="55" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="258" y="444" class="">100</text><text x="269" y="494" class="small">3</text><rect x="346" y="410" width="87" height="55" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="360" y="444" class="">100</text><text x="371" y="494" class="small">4</text><rect x="448" y="410" width="87" height="55" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="462" y="444" class="">100</text><text x="473" y="494" class="small">5</text><rect x="550" y="410" width="87" height="55" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="564" y="444" class="">100</text><text x="575" y="494" class="small">6</text><rect x="652" y="410" width="87" height="55" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="666" y="444" class="">100</text><text x="677" y="494" class="small">7</text><rect x="754" y="410" width="87" height="55" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="768" y="444" class="">100</text><text x="779" y="494" class="small">8</text><rect x="856" y="410" width="87" height="55" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="870" y="444" class="">200</text><text x="881" y="494" class="small">9</text><rect x="958" y="410" width="87" height="55" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="972" y="444" class="">1000</text><text x="983" y="494" class="small">10</text><text x="40" y="530" class="small">Milliseconds; ranks 1–10. Median = 100 ms; p90 = rank 9 = 200 ms; mean = 200 ms.</text><text x="40" y="579" class="label">USER-VISIBLE BOUNDARY</text><rect x="40" y="602" width="260" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="630" class="label">Network + client</text><line x1="300" y1="638" x2="353" y2="638" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="353" y="602" width="300" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="367" y="630" class="label">Queue + scheduling</text><line x1="653" y1="638" x2="706" y2="638" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="706" y="602" width="350" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="720" y="630" class="label">Model / GPU execution</text></svg>