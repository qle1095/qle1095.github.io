<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" role="img" aria-labelledby="title desc"><title id="title">Correlate workload, timing, and deployment evidence</title><desc id="desc">Four aligned incident panels show constant QPS at 20, input P95 rising from 1000 to 8000 tokens, TTFT P95 from 200 to 1200 ms, and stable per-user decode rate of 40 tokens/s. A request waterfall separates queue, prefill, decode and network/client spans. Hypothesis arrows point to cache misses and prefill, with audit/configuration events and privacy-aware trace IDs providing context.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="790" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Correlate workload, timing, and deployment evidence</text><text x="35" y="82" font-size="20" fill="#0f172a" text-anchor="start">Hypothetical incident: schematic trends, not to scale</text><text x="35" y="135" font-size="19" fill="#0f172a" text-anchor="start">QPS</text><path d="M220,175 L930,175" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M230,155 L555,155 L565,155 L915,155" fill="none" stroke="#2563eb" stroke-width="4"/><text x="285" y="137" font-size="17" fill="#0f172a" text-anchor="start">20</text><text x="755" y="137" font-size="17" fill="#0f172a" text-anchor="start">20</text><path d="M560,105 L560,175" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><text x="35" y="228" font-size="19" fill="#0f172a" text-anchor="start">Input P95</text><path d="M220,268 L930,268" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M230,248 L555,248 L565,211 L915,211" fill="none" stroke="#0f766e" stroke-width="4"/><text x="285" y="230" font-size="17" fill="#0f172a" text-anchor="start">1k tokens</text><text x="755" y="230" font-size="17" fill="#0f172a" text-anchor="start">8k tokens</text><path d="M560,198 L560,268" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><text x="35" y="321" font-size="19" fill="#0f172a" text-anchor="start">TTFT P95</text><path d="M220,361 L930,361" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M230,341 L555,341 L565,304 L915,304" fill="none" stroke="#0f766e" stroke-width="4"/><text x="285" y="323" font-size="17" fill="#0f172a" text-anchor="start">200 ms</text><text x="755" y="323" font-size="17" fill="#0f172a" text-anchor="start">1,200 ms</text><path d="M560,291 L560,361" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><text x="35" y="414" font-size="19" fill="#0f172a" text-anchor="start">Per-user decode</text><path d="M220,454 L930,454" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M230,434 L555,434 L565,434 L915,434" fill="none" stroke="#2563eb" stroke-width="4"/><text x="285" y="416" font-size="17" fill="#0f172a" text-anchor="start">40 tokens/s</text><text x="755" y="416" font-size="17" fill="#0f172a" text-anchor="start">40 tokens/s</text><path d="M560,384 L560,454" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><text x="515" y="509" font-size="17" fill="#0f172a" text-anchor="start">14:00 change</text><text x="35" y="552" font-size="21" fill="#0f172a" text-anchor="start">Locate delay in spans before choosing a fix</text><rect x="35" y="578" width="210" height="55" rx="8" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="140.0" y="605" font-size="18" fill="#0f172a" text-anchor="middle">Queue wait</text><rect x="245" y="578" width="235" height="55" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="362.5" y="605" font-size="18" fill="#0f172a" text-anchor="middle">Prefill</text><rect x="480" y="578" width="300" height="55" rx="8" fill="#99f6e4" stroke="#2563eb" stroke-width="2"/><text x="630.0" y="605" font-size="18" fill="#0f172a" text-anchor="middle">Decode</text><rect x="780" y="578" width="185" height="55" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/><text x="872.5" y="605" font-size="18" fill="#0f172a" text-anchor="middle">Client / network</text><text x="35" y="672" font-size="19" fill="#0f172a" text-anchor="start">Longer input / cache misses → investigate prefill and cache metrics.</text><text x="35" y="707" font-size="19" fill="#0f172a" text-anchor="start">Also inspect queue wait, readiness, version changes and trace IDs.</text><text x="35" y="749" font-size="19" fill="#0f172a" text-anchor="start">Correlation is evidence for a hypothesis, not proof of a cause.</text></g></svg>