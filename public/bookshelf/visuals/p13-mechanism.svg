<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 765" width="1000" height="765" role="img" aria-labelledby="title desc"><title id="title">A rollout is a gated state transition</title><desc id="desc">A canary state machine moves from build to ready capacity, small traffic, measured gates and gradual ramp, with a rollback branch. At 1000 requests/minute, a 20 percent share is 200 requests/minute, requiring two ready replicas at 100 each before headroom. A second lane keeps old capacity available while in-flight work drains.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="765" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">A rollout is a gated state transition</text><text x="35" y="82" font-size="20" fill="#0f172a" text-anchor="start">Readiness and evaluation gates come before traffic expansion.</text><rect x="35" y="115" width="165" height="75" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="117.5" y="142" font-size="18" fill="#0f172a" text-anchor="middle">Build / validate</text><path d="M200,151 L225,151" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="227" y="115" width="165" height="75" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="309.5" y="142" font-size="18" fill="#0f172a" text-anchor="middle">Ready replicas</text><path d="M392,151 L417,151" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="419" y="115" width="165" height="75" rx="8" fill="#ccfbf1" stroke="#2563eb" stroke-width="2"/><text x="501.5" y="142" font-size="18" fill="#0f172a" text-anchor="middle">Small traffic</text><path d="M584,151 L609,151" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="611" y="115" width="165" height="75" rx="8" fill="#ccfbf1" stroke="#2563eb" stroke-width="2"/><text x="693.5" y="142" font-size="18" fill="#0f172a" text-anchor="middle">Measure gates</text><path d="M776,151 L801,151" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="803" y="115" width="165" height="75" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="885.5" y="142" font-size="18" fill="#0f172a" text-anchor="middle">Ramp share</text><path d="M693,190 L693,259" stroke="#a16207" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="525" y="259" width="335" height="80" rx="8" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="692.5" y="286" font-size="18" fill="#0f172a" text-anchor="middle">Gate fails → rollback</text><text x="692.5" y="310" font-size="18" fill="#0f172a" text-anchor="middle">Retain usable old capacity</text><text x="35" y="236" font-size="18" fill="#0f172a" text-anchor="start">Gates: quality, errors, P95 latency, saturation</text><text x="35" y="384" font-size="21" fill="#0f172a" text-anchor="start">Capacity is a prerequisite, not a result of shifting traffic</text><rect x="35" y="410" width="275" height="88" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="172.5" y="437" font-size="18" fill="#0f172a" text-anchor="middle">1,000 requests/minute</text><text x="172.5" y="461" font-size="18" fill="#0f172a" text-anchor="middle">× 20% canary = 200/min</text><path d="M310,454 L350,454" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="350" y="410" width="270" height="88" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="485.0" y="437" font-size="18" fill="#0f172a" text-anchor="middle">100 requests/minute</text><text x="485.0" y="461" font-size="18" fill="#0f172a" text-anchor="middle">per ready replica</text><path d="M620,454 L660,454" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="660" y="410" width="295" height="88" rx="8" fill="#ccfbf1" stroke="#2563eb" stroke-width="2"/><text x="807.5" y="437" font-size="18" fill="#0f172a" text-anchor="middle">200 / 100 = 2 ready</text><text x="807.5" y="461" font-size="18" fill="#0f172a" text-anchor="middle">Then add headroom</text><text x="35" y="550" font-size="19" fill="#0f172a" text-anchor="start">Old-version lane: in-flight requests remain attached until complete</text><rect x="200" y="580" width="500" height="34" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="35" y="605" font-size="18" fill="#0f172a" text-anchor="start">Old streams</text><text x="710" y="605" font-size="18" fill="#0f172a" text-anchor="start">Drain → retire</text><rect x="370" y="638" width="540" height="34" rx="8" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="35" y="663" font-size="18" fill="#0f172a" text-anchor="start">New requests</text><path d="M365,575 L365,685" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><text x="250" y="721" font-size="18" fill="#0f172a" text-anchor="start">Traffic shift: stop assigning new work to the old version</text></g></svg>