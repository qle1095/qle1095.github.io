<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Split phases when the entire path wins</title><desc id="desc">A request is classified by remaining uncached work and queue/load. Expensive prefill goes to a prefill worker, transfers KV state, then continues at a decode worker. Short/cache-hit requests bypass the remote prefill path for local handling. A control loop watches prefill queues, decode KV capacity and transfer utilization to adjust xPyD rather than blindly adding prefill workers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="590" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Split phases when the entire path wins</text><rect x="35" y="90" width="285" height="130" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="49" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Conditional routing</text><text x="49" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Uncached token work</text><text x="49" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Queue / load / cache state</text><text x="49" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Choose complete path</text><rect x="390" y="90" width="245" height="130" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="404" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Prefill worker</text><text x="404" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Process prompt</text><text x="404" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Build compatible KV</text><rect x="735" y="90" width="230" height="130" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="749" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Decode worker</text><text x="749" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Continue generation</text><text x="749" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Needs prompt state</text><path d="M320 150 L390 150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M635 150 L735 150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="685.0" y="132" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="middle">KV</text><path d="M180 220 L180 295 L845 295 L845 220" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="235" y="278" font-size="19" fill="#0f172a" font-weight="normal" text-anchor="start">Short / cache-hit: handle locally, avoid remote path</text><rect x="35" y="370" width="285" height="140" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="49" y="399" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Prefill queue growing?</text><text x="49" y="428" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Arrivals &gt; prefill capacity</text><text x="49" y="453" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Add P only if D / links fit</text><text x="49" y="478" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">10/s − 8/s = +2 queued/s</text><rect x="355" y="370" width="285" height="140" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="369" y="399" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Decode KV exhausted?</text><text x="369" y="428" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Active token state limits work</text><text x="369" y="453" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">More P can worsen pressure</text><text x="369" y="478" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Inspect capacity / representation</text><rect x="675" y="370" width="290" height="140" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="689" y="399" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Transfer saturated?</text><text x="689" y="428" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">KV bytes / effective bandwidth</text><text x="689" y="453" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Layout conversion and contention</text><text x="689" y="478" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Fix network or bytes, not just P</text><text x="35" y="555" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">xPyD = prefill workers + decode workers; optimize SLO-goodput at total cost.</text></g></svg>