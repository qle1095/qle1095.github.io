<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Compare drafts, Medusa and EAGLE</title><desc id="desc">Three candidate-generation paths feed target verification. Independent drafting maintains a separate model and state; Medusa adds future-token heads to target representations; EAGLE-3 uses multiple target hidden states in a trained drafter. The verifier is common to all. A decision footer requires cost per accepted-plus-correction token, memory, training and sampling guarantees.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Compare drafts, Medusa and EAGLE</text><rect x="30" y="90" width="260" height="145" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Independent draft</text><text x="44" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Tokens → small model</text><text x="44" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Own weights + KV state</text><text x="44" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Standalone or distilled</text><rect x="365" y="90" width="270" height="145" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="379" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Medusa heads</text><text x="379" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Target representation</text><text x="379" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Multiple future-position heads</text><text x="379" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Training / acceptance variants</text><rect x="710" y="90" width="260" height="145" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="724" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">EAGLE-3</text><text x="724" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Multiple target hidden states</text><text x="724" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Trained lightweight drafter</text><text x="724" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Original EAGLE differs</text><path d="M160 235 L160 300" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M500 235 L500 300" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M840 235 L840 300" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="70" y="310" width="860" height="115" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="84" y="339" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Target verification remains essential</text><text x="84" y="368" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Accept a valid prefix, correct rejection, discard dependent suffix</text><text x="84" y="393" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Exact-distribution sampling and approximate typical acceptance are different</text><text x="35" y="480" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Compare: complete iteration time ÷ mean emitted tokens</text><text x="35" y="525" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Then check state memory, domain shift, training effort and SLO-goodput.</text></g></svg>