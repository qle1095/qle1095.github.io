<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" role="img" aria-labelledby="title desc"><title id="title">Route and scale by work, not counts alone</title><desc id="desc">Three equal request counts hide token totals of 1000, 1000 and 20000. A router compares eligibility, queue wait and useful cached work. In a two-stage pipeline, 30 jobs/s upstream feeds only 10 jobs/s downstream, growing a bounded queue. Five sequential stages have four internal edges; a 40 ms penalty per edge totals 160 ms.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="780" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Route and scale by work, not counts alone</text><text x="35" y="82" font-size="21" fill="#0f172a" text-anchor="start">Request count hides work: one request per replica</text><text x="35" y="138" font-size="18" fill="#0f172a" text-anchor="start">1000 tokens</text><rect x="215" y="115" width="34.5" height="28" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="35" y="183" font-size="18" fill="#0f172a" text-anchor="start">1000 tokens</text><rect x="215" y="160" width="34.5" height="28" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="35" y="228" font-size="18" fill="#0f172a" text-anchor="start">20000 tokens</text><rect x="215" y="205" width="690.0" height="28" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="35" y="274" font-size="19" fill="#0f172a" text-anchor="start">A prefix-cache hit is one component of estimated completion time.</text><rect x="35" y="300" width="430" height="85" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="327" font-size="18" fill="#0f172a" text-anchor="middle">Replica A: 250 ms waiting + 50 ms work</text><text x="250.0" y="351" font-size="18" fill="#0f172a" text-anchor="middle">300 ms total</text><rect x="535" y="300" width="430" height="85" rx="8" fill="#ccfbf1" stroke="#2563eb" stroke-width="2"/><text x="750.0" y="327" font-size="18" fill="#0f172a" text-anchor="middle">Replica B: 20 ms waiting + 150 ms work</text><text x="750.0" y="351" font-size="18" fill="#0f172a" text-anchor="middle">170 ms total — choose B</text><text x="35" y="427" font-size="21" fill="#0f172a" text-anchor="start">Separate stages require separate capacity</text><rect x="35" y="454" width="235" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="152.5" y="481" font-size="18" fill="#0f172a" text-anchor="middle">Stage 1</text><text x="152.5" y="505" font-size="18" fill="#0f172a" text-anchor="middle">30 jobs/s</text><path d="M270,490 L340,490" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="340" y="454" width="310" height="78" rx="8" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="495.0" y="481" font-size="18" fill="#0f172a" text-anchor="middle">Bounded queue</text><text x="495.0" y="505" font-size="18" fill="#0f172a" text-anchor="middle">Overload → reject / defer</text><path d="M650,490 L720,490" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="720" y="454" width="235" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="837.5" y="481" font-size="18" fill="#0f172a" text-anchor="middle">Stage 2</text><text x="837.5" y="505" font-size="18" fill="#0f172a" text-anchor="middle">10 jobs/s</text><text x="35" y="575" font-size="20" fill="#0f172a" text-anchor="start">Five sequential stages have four internal network edges:</text><rect x="45" y="605" width="140" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="115.0" y="632" font-size="18" fill="#0f172a" text-anchor="middle">Stage 1</text><path d="M185,631 L232,631" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="208" y="686" font-size="16" fill="#0f172a" text-anchor="middle">+40 ms</text><rect x="232" y="605" width="140" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="302.0" y="632" font-size="18" fill="#0f172a" text-anchor="middle">Stage 2</text><path d="M372,631 L419,631" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="395" y="686" font-size="16" fill="#0f172a" text-anchor="middle">+40 ms</text><rect x="419" y="605" width="140" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="489.0" y="632" font-size="18" fill="#0f172a" text-anchor="middle">Stage 3</text><path d="M559,631 L606,631" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="582" y="686" font-size="16" fill="#0f172a" text-anchor="middle">+40 ms</text><rect x="606" y="605" width="140" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="676.0" y="632" font-size="18" fill="#0f172a" text-anchor="middle">Stage 4</text><path d="M746,631 L793,631" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="769" y="686" font-size="16" fill="#0f172a" text-anchor="middle">+40 ms</text><rect x="793" y="605" width="140" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="863.0" y="632" font-size="18" fill="#0f172a" text-anchor="middle">Stage 5</text><text x="35" y="735" font-size="20" fill="#0f172a" text-anchor="start">Four edges × 40 ms additional delay = 160 ms on the critical path.</text></g></svg>