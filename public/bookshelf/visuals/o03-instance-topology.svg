<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Budget the entire instance and its links</title><desc id="desc">Two GPU groups connect through a slower inter-node network, while each group has its own fast local fabric. Host memory reaches GPUs through a separate CPU-GPU link. A unit conversion shows 400 Gb/s equals 50 GB/s and 10 GB requires at least 200 ms. A MIG inset distinguishes compute and memory slices from separately provisioned host resources.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Budget the entire instance and its links</text><rect x="30" y="95" width="410" height="155" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="124" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Node A · example GPU group</text><text x="44" y="153" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">GPU 0 ← local fabric → GPU 1</text><text x="44" y="178" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">GPU 2 ← local fabric → GPU 3</text><text x="44" y="203" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Host CPU / RAM: separate resources</text><rect x="560" y="95" width="410" height="155" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="574" y="124" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Node B · example GPU group</text><text x="574" y="153" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">GPU 4 ← local fabric → GPU 5</text><text x="574" y="178" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">GPU 6 ← local fabric → GPU 7</text><text x="574" y="203" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Host CPU / RAM: separate resources</text><path d="M440 165 L560 165" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500.0" y="145" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="middle">network</text><rect x="30" y="310" width="450" height="150" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="339" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Bandwidth unit check</text><text x="44" y="368" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">400 Gb/s ÷ 8 = 50 GB/s</text><text x="44" y="393" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">10 GB ÷ 50 GB/s = 0.20 s minimum</text><text x="44" y="418" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Specify one-way vs aggregate rates</text><rect x="525" y="310" width="445" height="150" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="539" y="339" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">MIG is a GPU resource profile</text><text x="539" y="368" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Compute slice fraction ≠ memory fraction</text><text x="539" y="393" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Host CPU / RAM bundle comes from provider</text><text x="539" y="418" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Fit weights + KV + workspace per partition</text><text x="30" y="520" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="start">Topology is illustrative. Real GPU counts, rates and profiles must be inspected.</text></g></svg>