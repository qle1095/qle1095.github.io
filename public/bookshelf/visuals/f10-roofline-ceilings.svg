<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" role="img" aria-labelledby="t d"><title id="t">Roofline ceilings and weight reuse</title><desc id="d">Hypothetical 100 TFLOP per second compute and 2 terabytes per second bandwidth intersect at 50 FLOP per byte. At intensity ten the bound is twenty TFLOP per second. Batching reuses the same weight bytes for more token rows.</desc><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.small{font-size:16px}.heading{font-size:25px;font-weight:bold}.label{font-weight:bold}</style><rect width="1100" height="740" fill="#f8fafc"/><text x="40" y="42" class="heading">More compute helps only when compute is the limit</text><text x="40" y="72">Hypothetical ceilings: C = 100 TFLOP/s, B = 2 TB/s · decimal units</text><line x1="100" y1="430" x2="710" y2="430" stroke="#0f172a" stroke-width="2"/><line x1="100" y1="430" x2="100" y2="120" stroke="#0f172a" stroke-width="2"/><text transform="translate(33 385) rotate(-90)">Performance bound (TFLOP/s)</text><text x="245" y="490">Arithmetic intensity (FLOP/byte)</text><text x="79" y="455">0</text><text x="141" y="455">10</text><text x="330" y="455">50</text><text x="568" y="455">100</text><text x="51" y="377">20</text><text x="42" y="155">100</text><line x1="100" y1="150" x2="690" y2="150" stroke="#94a3b8" stroke-dasharray="5 6"/><line x1="100" y1="430" x2="340" y2="150" stroke="#2563eb" stroke-width="6"/><line x1="340" y1="150" x2="690" y2="150" stroke="#0f766e" stroke-width="6"/><line x1="340" y1="150" x2="340" y2="430" stroke="#64748b" stroke-dasharray="5 6"/><circle cx="148" cy="374" r="7" fill="#2563eb"/><text x="169" y="375">I = 10 → bound = 20</text><circle cx="340" cy="150" r="7" fill="#0f766e"/><text x="290" y="115" class="label">Ridge: C/B = 50</text><text x="457" y="184" class="label">Compute ceiling</text><text x="110" y="263" class="label">Bandwidth ceiling</text><text x="463" y="212" class="small">More intensity cannot</text><text x="463" y="235" class="small">raise this roof.</text><rect x="752" y="115" width="303" height="313" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="775" y="150" class="label">Work: 2 TFLOPs</text><text x="775" y="182">Traffic: 0.2 TB</text><text x="775" y="230">Compute floor: 0.02 s</text><text x="775" y="262">Memory floor: 0.10 s</text><text x="775" y="309" class="label">Time ≥ 0.10 s</text><text x="775" y="350" class="small">2× compute: still ≥ 0.10 s</text><text x="775" y="390" class="small">Bounds assume ideal overlap.</text><line x1="40" y1="520" x2="1060" y2="520" stroke="#cbd5e1"/><text x="40" y="557" class="heading">Why token batches move right: reuse the weight read</text><rect x="45" y="590" width="210" height="95" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="66" y="623" class="label">P FP16 weights</text><text x="66" y="655">Read once: 2P bytes</text><path d="M255 637 H320" stroke="#0f172a" stroke-width="3"/><path d="M310 631 L320 637 L310 643" fill="none" stroke="#0f172a" stroke-width="3"/><rect x="335" y="590" width="330" height="95" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="355" y="623" class="label">b token rows use the weights</text><text x="355" y="655">Work ≈ 2bP FLOPs</text><text x="700" y="623" class="label">Weight-only I ≈ b FLOP/byte</text><text x="700" y="655" class="small">KV / activations / scheduling omitted.</text><text x="45" y="720" class="small">More reuse may help throughput; latency and full-model traffic still need measurement.</text></svg>