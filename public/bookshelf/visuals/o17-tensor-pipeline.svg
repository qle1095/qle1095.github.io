<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Partition models across topology</title><desc id="desc">Tensor parallelism splits X and W along matching feature dimensions: GPU 0 produces X1 × W1 and GPU 1 produces X2 × W2; reduction adds partial outputs into Y. A timing model shows 20 ms local work becoming 10 ms plus 12 ms communication, worsening latency to 22 ms. Pipeline stages process requests A, B, C in staggered intervals, exposing initial idle bubbles and throughput overlap.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="590" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Partition models across topology</text><rect x="35" y="90" width="320" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="49" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">GPU 0 · tensor shard</text><text x="49" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Y0 = X1 W1</text><rect x="35" y="235" width="320" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="49" y="264" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">GPU 1 · tensor shard</text><text x="49" y="293" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Y1 = X2 W2</text><rect x="565" y="165" width="400" height="110" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="579" y="194" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Reduction required</text><text x="579" y="223" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Y = Y0 + Y1</text><text x="579" y="248" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Not concatenation of these partials</text><path d="M355 140 L565 200" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M355 285 L565 245" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="385" font-size="21" fill="#0f172a" font-weight="bold" text-anchor="start">Pipeline example: equal 5 ms stages; independent requests</text><text x="35" y="432" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Stage 1</text><text x="35" y="492" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Stage 2</text><rect x="165" y="402" width="220" height="40" fill="#2563eb"/><rect x="390" y="402" width="220" height="40" fill="#0f766e"/><rect x="615" y="402" width="220" height="40" fill="#64748b"/><rect x="165" y="462" width="220" height="40" fill="#cbd5e1"/><rect x="390" y="462" width="220" height="40" fill="#2563eb"/><rect x="615" y="462" width="220" height="40" fill="#0f766e"/><text x="265" y="430" font-size="20" fill="white" font-weight="normal" text-anchor="start">A</text><text x="490" y="430" font-size="20" fill="white" font-weight="normal" text-anchor="start">B</text><text x="715" y="430" font-size="20" fill="white" font-weight="normal" text-anchor="start">C</text><text x="230" y="490" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Idle bubble</text><text x="490" y="490" font-size="20" fill="white" font-weight="normal" text-anchor="start">A</text><text x="715" y="490" font-size="20" fill="white" font-weight="normal" text-anchor="start">B</text><text x="35" y="550" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Latency example: 20 ms → 10 ms local + 12 ms messages = 22 ms (slower)</text></g></svg>