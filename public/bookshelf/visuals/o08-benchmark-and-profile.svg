<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Make performance claims you can defend</title><desc id="desc">A request timeline separates queue, prefill and decode, with TTFT ending at the first token. Two experiment designs compare an invalid changed-workload comparison against a controlled baseline and one changed optimization. A queue example shows 12 arrivals/s and 10 completions/s producing 2 additional queued requests/s. Profiling zooms from system to operation to kernel.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Make performance claims you can defend</text><text x="30" y="90" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Request time: where was the delay?</text><rect x="35" y="115" width="260" height="48" fill="#94a3b8"/><rect x="295" y="115" width="200" height="48" fill="#2563eb"/><rect x="495" y="115" width="470" height="48" fill="#0f766e"/><text x="55" y="147" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="start">Queue</text><text x="320" y="147" font-size="20" fill="white" font-weight="normal" text-anchor="start">Prefill</text><text x="530" y="147" font-size="20" fill="white" font-weight="normal" text-anchor="start">Decode token stream</text><text x="35" y="198" font-size="19" fill="#0f172a" font-weight="normal" text-anchor="start">TTFT includes queue + first-token computation</text><rect x="35" y="235" width="440" height="135" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="49" y="264" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Confounded experiment</text><text x="49" y="293" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Baseline: varied, mostly cold prompts</text><text x="49" y="318" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Candidate: one repeated warm prompt</text><text x="49" y="343" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Cache benefit and workload both changed</text><rect x="525" y="235" width="440" height="135" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="539" y="264" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Controlled experiment</text><text x="539" y="293" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Same traffic distribution and cache policy</text><text x="539" y="318" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Baseline versus one configuration change</text><text x="539" y="343" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Then test interactions</text><rect x="35" y="405" width="440" height="105" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="49" y="434" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Open-loop overload example</text><text x="49" y="463" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">12 arrivals/s − 10 completions/s</text><text x="49" y="488" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">= +2 queued requests/s</text><rect x="525" y="405" width="440" height="105" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="539" y="434" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Profile the suspected cause</text><text x="539" y="463" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">System trace → operation → kernel</text><text x="539" y="488" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Then remeasure end-to-end</text></g></svg>