<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" role="img" aria-labelledby="title desc"><title id="title">Two optimizations change different parts of the system</title><desc id="desc">FlashAttention tiles exact attention so score and probability intermediates stay in fast on-chip storage instead of being materialized in HBM. PagedAttention maps logical token blocks to scattered physical KV blocks. Three allocated32-token blocks hold sequences of17 and50 tokens, using96 slots for67 tokens; final-block waste remains.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="770" fill="#f8fafc"/><text x="35" y="40" class="title">Two optimizations change different parts of the system</text><text x="40" y="82" class="label">FLASHATTENTION: DATA MOVEMENT</text><rect x="40" y="109" width="255" height="86" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="137" class="label">HBM inputs</text><text x="54" y="162" class="">Q / K / V blocks</text><line x1="295" y1="151" x2="350" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="109" width="425" height="86" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="364" y="137" class="label">On-chip tile + running normalization</text><text x="364" y="162" class="">Compute scores, softmax and value mixing</text><line x1="775" y1="151" x2="830" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="830" y="109" width="230" height="86" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="844" y="137" class="label">HBM output</text><text x="844" y="162" class="">Final result</text><text x="40" y="237" class="label">Avoid writing and rereading complete N × N score/probability matrices.</text><text x="40" y="277" class="small">Same mathematical full attention; pairwise work still scales quadratically with sequence length.</text><line x1="40" y1="314" x2="1060" y2="314" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="355" class="label">PAGEDATTENTION: WHERE KV BLOCKS LIVE</text><rect x="40" y="393" width="230" height="77" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="421" class="label">Request A: 17 tokens</text><text x="54" y="446" class="">Logical block A0</text><rect x="40" y="530" width="230" height="77" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="558" class="label">Request B: 50 tokens</text><text x="54" y="583" class="">Logical blocks B0, B1</text><rect x="338" y="439" width="220" height="122" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="352" y="467" class="label">Block table</text><text x="352" y="492" class="">A0 → physical 3</text><text x="352" y="517" class="">B0 → 1; B1 → 4</text><line x1="270" y1="432" x2="338" y2="475" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="270" y1="567" x2="338" y2="530" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="655" y="382" width="405" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="669" y="410" class="label">Physical 1 · B0: 32 used</text><rect x="655" y="444" width="405" height="52" rx="6" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="669" y="472" class="label">Physical 2 · Free</text><rect x="655" y="506" width="405" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="669" y="534" class="label">Physical 3 · A0: 17 used</text><rect x="655" y="568" width="405" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="669" y="596" class="label">Physical 4 · B1: 18 used</text><line x1="558" y1="486" x2="655" y2="528" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="558" y1="506" x2="655" y2="407" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="558" y1="529" x2="655" y2="588" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="686" class="label">Three 32-token blocks = 96 slots for 67 tokens; 29 unused slots remain in final blocks.</text><text x="40" y="729" class="small">Paging changes allocation, not which logical tokens the attention computation must consider.</text></svg>