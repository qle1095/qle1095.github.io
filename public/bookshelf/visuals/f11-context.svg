<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 890" role="img" aria-labelledby="title desc"><title id="title">Different architectures retain different access to history</title><desc id="desc">Six schematic history positions illustrate a sliding window excluding the oldest three, compressed history summarizing older positions, and MLA retaining compressed state per position. A recurrent update maps prior state and current input to next state. A hybrid sequence combines state-space and attention blocks; the whole system has both costs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="890" fill="#f8fafc"/><text x="35" y="40" class="title">Different architectures retain different access to history</text><text x="40" y="87" class="label">1. Sliding window: only recent direct access</text><rect x="70" y="110" width="77" height="52" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="138" class="label">1</text><line x1="78" y1="118" x2="136" y2="153" stroke="#64748b" stroke-width="2"/><rect x="162" y="110" width="77" height="52" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="176" y="138" class="label">2</text><line x1="170" y1="118" x2="228" y2="153" stroke="#64748b" stroke-width="2"/><rect x="254" y="110" width="77" height="52" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="268" y="138" class="label">3</text><line x1="262" y1="118" x2="320" y2="153" stroke="#64748b" stroke-width="2"/><rect x="346" y="110" width="77" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="360" y="138" class="label">4</text><rect x="438" y="110" width="77" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="452" y="138" class="label">5</text><rect x="530" y="110" width="77" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="544" y="138" class="label">6</text><text x="690" y="142" class="">Older positions excluded from this window.</text><text x="40" y="210" class="label">2. Compressed history: summaries plus recent detail</text><rect x="70" y="235" width="260" height="58" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="84" y="263" class="label">Summary of positions 1–3</text><rect x="368" y="235" width="77" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="382" y="263" class="label">4</text><rect x="460" y="235" width="77" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="474" y="263" class="label">5</text><rect x="552" y="235" width="77" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="566" y="263" class="label">6</text><text x="690" y="270" class="">Compression changes retained detail.</text><text x="40" y="343" class="label">3. Latent KV: compressed state for each position</text><rect x="70" y="368" width="77" height="58" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="84" y="396" class="label">1</text><rect x="162" y="368" width="77" height="58" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="176" y="396" class="label">2</text><rect x="254" y="368" width="77" height="58" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="268" y="396" class="label">3</text><rect x="346" y="368" width="77" height="58" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="360" y="396" class="label">4</text><rect x="438" y="368" width="77" height="58" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="452" y="396" class="label">5</text><rect x="530" y="368" width="77" height="58" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="544" y="396" class="label">6</text><text x="690" y="392" class="">All positions remain represented;</text><text x="690" y="420" class="">this alone does not remove pairwise work.</text><text x="40" y="476" class="label">4. Recurrent / linear: update a summary state</text><rect x="70" y="510" width="240" height="65" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="84" y="538" class="label">Prior state</text><rect x="70" y="600" width="240" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="84" y="628" class="label">Current input</text><line x1="310" y1="542" x2="375" y2="565" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="310" y1="629" x2="375" y2="593" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="535" width="260" height="87" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="404" y="563" class="label">State update</text><text x="404" y="588" class="">Architecture-specific</text><line x1="650" y1="578" x2="708" y2="578" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="720" y="535" width="340" height="87" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="734" y="563" class="label">Next state / query result</text><text x="734" y="588" class="">Past stored as a summary</text><text x="40" y="716" class="label">5. Hybrid: both recurrent and attention blocks contribute</text><rect x="70" y="747" width="250" height="65" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="84" y="775" class="label">State-space block</text><line x1="320" y1="780" x2="390" y2="780" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="405" y="747" width="250" height="65" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="419" y="775" class="label">Attention block</text><line x1="655" y1="780" x2="725" y2="780" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="747" width="320" height="65" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="754" y="775" class="label">State-space block</text><text x="40" y="857" class="small">Schematic only. Use the trained architecture; evaluate which information the task still needs.</text></svg>