<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc"><title id="title">Quality is a gate, not a reward for a faster wrong answer</title><desc id="desc">Two candidate models pass average quality but only one passes the critical task slice. Fine-tuning changes parameters on domain data. Distillation trains a student using teacher probabilities or generated sequences; these are distinct training signals.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="730" fill="#f8fafc"/><text x="35" y="40" class="title">Quality is a gate, not a reward for a faster wrong answer</text><text x="40" y="83" class="label">ORIGINAL HYPOTHETICAL EVALUATION</text><rect x="40" y="108" width="240" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="136" class="label">Candidate A: large</text><text x="54" y="161" class="">Quality 96% · 150 ms</text><rect x="40" y="217" width="240" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="245" class="label">Candidate B: small</text><text x="54" y="270" class="">Quality 97% · 70 ms</text><line x1="280" y1="151" x2="345" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="280" y1="260" x2="345" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="345" y="108" width="300" height="90" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="359" y="136" class="label">Permission-boundary slice</text><text x="359" y="161" class="">A: 0 / 100 critical failures</text><rect x="345" y="217" width="300" height="90" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="359" y="245" class="label">Permission-boundary slice</text><text x="359" y="270" class="">B: 7 / 100 critical failures</text><line x1="645" y1="151" x2="705" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="645" y1="260" x2="705" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="705" y="108" width="350" height="90" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="719" y="136" class="label">Eligible for performance work</text><text x="719" y="161" class="">Still test cost and support</text><rect x="705" y="217" width="350" height="90" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="719" y="245" class="label">Fails this task-quality gate</text><text x="719" y="270" class="">Fix quality before release</text><text x="40" y="347" class="small">The average score hides a failure class that matters to this product.</text><line x1="40" y1="375" x2="1060" y2="375" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="415" class="label">HOW BEHAVIOR CHANGES</text><rect x="40" y="445" width="265" height="85" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="473" class="label">Domain examples + labels</text><text x="54" y="498" class="">Fine-tune pretrained weights</text><line x1="305" y1="488" x2="365" y2="488" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="445" width="305" height="85" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="379" y="473" class="label">Adapted model</text><text x="379" y="498" class="">Usually same network shape</text><text x="715" y="475" class="">Smaller can be sufficient,</text><text x="715" y="504" class="">but only task evals establish it.</text><rect x="40" y="579" width="265" height="95" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="607" class="label">Teacher outputs</text><text x="54" y="632" class="">Probabilities OR sequences</text><line x1="305" y1="625" x2="365" y2="625" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="579" width="305" height="95" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="379" y="607" class="label">Student training</text><text x="379" y="632" class="">Match supplied teacher signal</text><line x1="670" y1="625" x2="728" y2="625" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="728" y="579" width="327" height="95" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="742" y="607" class="label">Evaluate the student again</text><text x="742" y="632" class="">Strengths and errors can transfer</text><text x="40" y="708" class="small">Classical soft-target distillation and sequence distillation are related, not identical objectives.</text></svg>