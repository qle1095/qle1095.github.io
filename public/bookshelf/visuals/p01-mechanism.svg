<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="title desc"><title id="title">Visual inputs expand the language model context</title><desc id="desc">Visual input is encoded into a merged text-and-visual sequence before prefill and KV-backed decode. A 96-frame, 1000-token-per-frame policy uses 96000 tokens; six frames at 256 tokens use 1536 but can miss brief events. Specialist OCR and ASR can feed evidence into the same pipeline.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="700" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Visual inputs expand the language model context</text><text x="35" y="80" font-size="20" fill="#0f172a" text-anchor="start">Representations, not compressed file size, determine model work</text><rect x="25" y="110" width="170" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="110.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Image / video</text><text x="110.0" y="161" font-size="18" fill="#0f172a" text-anchor="middle">pixels + frames</text><rect x="220" y="110" width="170" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="305.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Vision encoder</text><text x="305.0" y="161" font-size="18" fill="#0f172a" text-anchor="middle">patches / features</text><rect x="415" y="110" width="170" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Merged sequence</text><text x="500.0" y="161" font-size="18" fill="#0f172a" text-anchor="middle">visual + text tokens</text><rect x="610" y="110" width="170" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="695.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Prefill</text><text x="695.0" y="161" font-size="18" fill="#0f172a" text-anchor="middle">build KV state</text><rect x="805" y="110" width="170" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="890.0" y="137" font-size="18" fill="#0f172a" text-anchor="middle">Decode</text><text x="890.0" y="161" font-size="18" fill="#0f172a" text-anchor="middle">uses long context</text><path d="M195,150 L220,150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M390,150 L415,150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M585,150 L610,150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M780,150 L805,150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="35" y="235" font-size="22" fill="#0f172a" text-anchor="start">Illustrative sampling budget for a four-second clip</text><text x="35" y="270" font-size="18" fill="#0f172a" text-anchor="start">96 frames × 1,000 tokens = 96,000 tokens</text><rect x="35" y="287" width="900" height="38" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="35" y="365" font-size="18" fill="#0f172a" text-anchor="start">6 frames × 256 tokens = 1,536 tokens</text><rect x="35" y="382" width="14.4" height="38" rx="8" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="75" y="407" font-size="18" fill="#0f172a" text-anchor="start">1.6% of the original token count; evidence may be lost</text><text x="35" y="464" font-size="20" fill="#0f172a" text-anchor="start">Sampling timeline: a brief event can fall between retained frames</text><path d="M40,505 L950,505" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="56" y="490" width="8" height="30" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="226" y="490" width="8" height="30" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="396" y="490" width="8" height="30" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="566" y="490" width="8" height="30" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="736" y="490" width="8" height="30" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="906" y="490" width="8" height="30" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="650" y="485" width="22" height="40" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="600" y="555" font-size="18" fill="#0f172a" text-anchor="start">100 ms alert: no sampled frame captures it</text><rect x="35" y="600" width="210" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="140.0" y="627" font-size="18" fill="#0f172a" text-anchor="middle">PDF text / OCR / ASR</text><path d="M245,630 L305,630" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="305" y="600" width="250" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="430.0" y="627" font-size="18" fill="#0f172a" text-anchor="middle">Selected evidence</text><path d="M555,630 L615,630" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="615" y="600" width="330" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="780.0" y="627" font-size="18" fill="#0f172a" text-anchor="middle">VLM: evaluate task quality + latency</text></g></svg>