<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 725" width="1000" height="725" role="img" aria-labelledby="title desc"><title id="title">Batching policy and scaling delay shape latency</title><desc id="desc">Three timeline lanes compare static waiting for a full batch, dynamic timeout, and continuous replacement of completed generation requests. A capacity timeline separates desired from ready replicas while a queue grows during startup. An example maps forty concurrent requests at eight SLO-safe requests per replica to five ready replicas, subject to sequence-shape and headroom limits.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="725" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="42" font-size="26" fill="#0f172a" text-anchor="start">Batching policy and scaling delay shape latency</text><text x="35" y="80" font-size="20" fill="#0f172a" text-anchor="start">Schematic scheduling: solid = executing; dashed = waiting</text><text x="220" y="113" font-size="16" fill="#0f172a" text-anchor="start">0 ms</text><text x="510" y="113" font-size="16" fill="#0f172a" text-anchor="start">300 ms</text><text x="830" y="113" font-size="16" fill="#0f172a" text-anchor="start">600 ms</text><text x="35" y="180" font-size="20" fill="#0f172a" text-anchor="start">Static batch</text><path d="M215,210 L930,210" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="35" y="275" font-size="20" fill="#0f172a" text-anchor="start">Dynamic batch</text><path d="M215,305 L930,305" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="35" y="370" font-size="20" fill="#0f172a" text-anchor="start">Continuous</text><path d="M215,400 L930,400" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M230,143 L560,143" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><rect x="560" y="132" width="250" height="13" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><path d="M300,162 L560,162" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><rect x="560" y="151" width="220" height="13" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><path d="M390,181 L560,181" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><rect x="560" y="170" width="190" height="13" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="570" y="228" font-size="17" fill="#0f172a" text-anchor="start">Wait for group to fill</text><path d="M230,238 L350,238" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><rect x="350" y="227" width="250" height="13" rx="8" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><path d="M300,257 L350,257" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><rect x="350" y="246" width="220" height="13" rx="8" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><path d="M390,276 L470,276" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 5"/><rect x="470" y="265" width="190" height="13" rx="8" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="630" y="319" font-size="17" fill="#0f172a" text-anchor="start">Timeout starts partial batch</text><rect x="230" y="325" width="170" height="13" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="300" y="344" width="250" height="13" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="400" y="363" width="140" height="13" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><path d="M405,332 L450,332" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="450" y="325" width="200" height="13" rx="8" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text x="665" y="392" font-size="17" fill="#0f172a" text-anchor="start">New work fills released slot</text><text x="35" y="455" font-size="22" fill="#0f172a" text-anchor="start">Scaling is delayed: desired capacity ≠ ready capacity</text><path d="M220,595 L935,595" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="225" y="630" font-size="17" fill="#0f172a" text-anchor="start">Traffic spike</text><text x="670" y="630" font-size="17" fill="#0f172a" text-anchor="start">New replicas ready</text><path d="M230,560 L330,560 L330,485 L890,485" stroke="#2563eb" stroke-width="4" fill="none" stroke-dasharray="8 5"/><path d="M230,560 L700,560 L700,485 L890,485" stroke="#0f766e" stroke-width="4" fill="none"/><text x="35" y="500" font-size="17" fill="#0f172a" text-anchor="start">Desired: dashed</text><text x="35" y="545" font-size="17" fill="#0f172a" text-anchor="start">Ready: solid</text><text x="360" y="580" font-size="18" fill="#0f172a" text-anchor="start">Queue grows while waiting for capacity</text><text x="35" y="680" font-size="19" fill="#0f172a" text-anchor="start">40 concurrent / 8 SLO-safe per replica = 5 ready replicas before headroom.</text></g></svg>