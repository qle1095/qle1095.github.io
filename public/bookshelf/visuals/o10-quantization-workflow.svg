<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Approve a quantized model with evidence</title><desc id="desc">Baseline weights flow into a quantization choice and representative calibration, then a distinct held-out evaluation. Component dtypes can differ for weights, activations, KV and sensitive operations. Quality slices and SLO performance form separate gates; a failed long-context slice loops back to revising precision instead of accepting a good overall average.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">Approve a quantized model with evidence</text><rect x="30" y="90" width="275" height="125" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="44" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Choose component dtypes</text><text x="44" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Weights / activations / KV</text><text x="44" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Sensitive ops: higher dtype</text><text x="44" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">PTQ or training-aware approach</text><rect x="365" y="90" width="275" height="125" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="379" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Calibration data</text><text x="379" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Choose scales / parameters</text><text x="379" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Match relevant workloads</text><text x="379" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Not the final quality test</text><rect x="700" y="90" width="270" height="125" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="714" y="119" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Held-out evaluation</text><text x="714" y="148" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Perplexity + task success</text><text x="714" y="173" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Product and context slices</text><text x="714" y="198" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Matched baseline</text><path d="M305 150 L365 150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M640 150 L700 150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="35" y="290" width="430" height="135" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="49" y="319" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Candidate A · hypothetical</text><text x="49" y="348" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Overall: 90 → 89.8%</text><text x="49" y="373" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Long context: 86 → 85.7%</text><text x="49" y="398" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Need uncertainty + acceptance tolerance</text><rect x="525" y="290" width="440" height="135" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="539" y="319" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Candidate B · hypothetical</text><text x="539" y="348" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Overall: 90 → 89.5%</text><text x="539" y="373" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Long context: 86 → 74%</text><text x="539" y="398" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Critical slice failure: revise / reject</text><text x="35" y="485" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Quality gate AND measured SLO / cost gate must pass</text><text x="35" y="530" font-size="17" fill="#0f172a" font-weight="normal" text-anchor="start">Selective repair can restore KV precision while retaining useful weight savings.</text></g></svg>