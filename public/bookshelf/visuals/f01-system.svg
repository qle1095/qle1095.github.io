<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc"><title id="title">A fast model instance is one part of a serving system</title><desc id="desc">Training creates a model artifact. Requests pass through routing and queueing into a runtime replica; additional replicas increase capacity. Tooling configures and observes both layers. A kernel failure, overloaded queue and hidden configuration belong to different layers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px}.title{font-size:26px;font-weight:bold}.label{font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="670" fill="#f8fafc"/><text x="35" y="40" class="title">A fast model instance is one part of a serving system</text><rect x="40" y="80" width="235" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="108" class="label">Training</text><text x="54" y="133" class="">Data → learned weights</text><line x1="275" y1="120" x2="340" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="80" width="280" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="354" y="108" class="label">Versioned model artifact</text><text x="354" y="133" class="">Weights + configuration</text><line x1="620" y1="120" x2="685" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="685" y="80" width="360" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="699" y="108" class="label">Inference</text><text x="699" y="133" class="">Use fixed weights on new input</text><text x="40" y="204" class="label">SERVING REQUEST PATH</text><rect x="40" y="235" width="175" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="54" y="263" class="label">Client</text><text x="54" y="288" class="">Request</text><line x1="215" y1="270" x2="275" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="235" width="255" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="289" y="263" class="label">Infrastructure</text><text x="289" y="288" class="">Route → queue</text><line x1="530" y1="270" x2="605" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="605" y="235" width="225" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="619" y="263" class="label">Runtime replica A</text><text x="619" y="288" class="">GPU model execution</text><line x1="830" y1="270" x2="890" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="890" y="235" width="170" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="904" y="263" class="label">Client</text><text x="904" y="288" class="">Output</text><rect x="605" y="340" width="225" height="70" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="619" y="368" class="label">Runtime replica B</text><text x="619" y="393" class="">Additional capacity</text><line x1="520" y1="305" x2="605" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="42" y="369" class="">Kernel bottleneck → inspect runtime</text><text x="42" y="398" class="">Traffic exceeds service rate → inspect capacity</text><text x="42" y="427" class="">Regional shortage → inspect fleet placement</text><rect x="40" y="480" width="1020" height="95" rx="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="54" y="508" class="label">Tooling: deploy, configure, measure, debug</text><text x="54" y="533" class="">Expose enough control to fix problems; abstract repetitive implementation work.</text><line x1="520" y1="480" x2="520" y2="315" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="725" y1="480" x2="725" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="623" class="small">Scaling out helps capacity only if routing, cold starts and downstream limits also cooperate.</text></svg>